<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel de Ferramentas</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9B%A0%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#EDF0F3;
  --surface:#FFFFFF;
  --surface-2:#F5F7F9;
  --text:#1A2027;
  --text-muted:#5B6572;
  --text-faint:#8993A0;
  --border:#DBE1E7;
  --border-strong:#C3CBD3;
  --accent:#2C3E63;
  --accent-2:#3D5586;
  --accent-contrast:#FFFFFF;
  --danger:#C4331F;
  --shadow: 0 1px 2px rgba(20,30,45,.06), 0 2px 8px rgba(20,30,45,.05);

  --st-pendente:#6B7280;      --st-pendente-bg:#EEF0F2;
  --st-ok:#1F8A54;            --st-ok-bg:#E4F5EC;
  --st-limpeza:#0F7E96;       --st-limpeza-bg:#E1F3F6;
  --st-nitretacao:#6E4FCB;    --st-nitretacao-bg:#EEE8FB;
  --st-int:#B4790E;           --st-int-bg:#FAF0DC;
  --st-ext:#C1600F;           --st-ext-bg:#FBE9DA;
  --st-quebrada:#C4331F;      --st-quebrada-bg:#FAE2DE;
  --st-outro:#6B6350;         --st-outro-bg:#EFECE2;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#12161C;
    --surface:#1A2029;
    --surface-2:#20272F;
    --text:#E8EBEF;
    --text-muted:#9DA7B3;
    --text-faint:#6B7480;
    --border:#2B3340;
    --border-strong:#3A4351;
    --accent:#7B93C9;
    --accent-2:#94ABDD;
    --accent-contrast:#0F1420;
    --danger:#E5695A;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.35);

    --st-pendente:#9AA3AF;     --st-pendente-bg:#242A32;
    --st-ok:#4FC787;           --st-ok-bg:#16281F;
    --st-limpeza:#4FC1D6;      --st-limpeza-bg:#122A2E;
    --st-nitretacao:#B29CF2;   --st-nitretacao-bg:#241E38;
    --st-int:#E3B54C;          --st-int-bg:#2E2612;
    --st-ext:#F0985A;          --st-ext-bg:#331F0F;
    --st-quebrada:#E5695A;     --st-quebrada-bg:#331813;
    --st-outro:#C2B89A;        --st-outro-bg:#2A2720;
  }
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
h1,h2,h3,.display{
  font-family:"Big Shoulders Display",system-ui,sans-serif;
  text-transform:uppercase;
  letter-spacing:.02em;
  text-wrap:balance;
  font-weight:800;
  margin:0;
}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;}
button{font-family:inherit;}
img{max-width:100%;}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px;}

#app{max-width:640px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;}
#app.role-pcp{max-width:640px;}
@media (min-width:900px){ #app.role-pcp{max-width:94vw;} }
@media (min-width:1300px){ #app.role-pcp{max-width:1600px;} }

/* ---------- Auth screen ---------- */
.auth-wrap{
  min-height:100vh;display:flex;flex-direction:column;justify-content:center;
  padding:28px 20px;gap:22px;
}
.auth-brand{display:flex;flex-direction:column;gap:2px;margin-bottom:4px;}
.auth-brand .eyebrow{
  font-family:"IBM Plex Mono";font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--text-faint);
}
.auth-brand h1{font-size:clamp(30px,8vw,40px);color:var(--accent);line-height:.95;}
.auth-card{
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;
}
.tabbar{display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:3px;gap:3px;}
.tabbar button{
  flex:1;border:none;background:transparent;padding:10px 8px;border-radius:6px;
  font-weight:600;font-size:14px;color:var(--text-muted);cursor:pointer;
}
.tabbar button.active{background:var(--surface);color:var(--accent);box-shadow:var(--shadow);}

.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-size:13px;font-weight:600;color:var(--text-muted);}
.field input[type=text],.field input[type=password],.field input[type=number],.field input[type=date],.field textarea,.field select{
  border:1.5px solid var(--border-strong);border-radius:8px;padding:12px 12px;font-size:16px;
  background:var(--surface);color:var(--text);width:100%;
}
.field textarea{resize:vertical;min-height:64px;font-family:inherit;}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent-2);}
.hint{font-size:12.5px;color:var(--text-faint);}
.error-msg{
  background:var(--st-quebrada-bg);color:var(--st-quebrada);border:1px solid var(--st-quebrada);
  border-radius:8px;padding:10px 12px;font-size:13.5px;font-weight:500;
}
.warn-msg{
  background:var(--st-int-bg);color:var(--st-int);border:1px solid var(--st-int);
  border-radius:8px;padding:10px 12px;font-size:13px;font-weight:500;display:flex;flex-direction:column;gap:8px;
}
/* ---------- BASE_APP import (Etapa 3) ---------- */
.baseapp-cards{display:flex;flex-direction:column;gap:10px;margin:10px 0;}
.baseapp-card{border:1px solid var(--border);border-radius:10px;padding:12px;}
.baseapp-card-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px;}
.baseapp-datehead{font-weight:700;font-size:14px;}
.baseapp-papel-badge{font-size:11px;font-weight:800;letter-spacing:.03em;padding:3px 8px;border-radius:999px;text-transform:uppercase;}
.baseapp-papel-badge.atual{background:var(--accent);color:var(--accent-contrast);}
.baseapp-papel-badge.proxima{background:var(--surface-2,var(--border));color:var(--text);}
.baseapp-papel-badge.futura{background:transparent;color:var(--text-muted);border:1px solid var(--border);}
.baseapp-situacao{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;margin-left:auto;}
.baseapp-situacao.NOVA{background:var(--st-ok-bg);color:var(--st-ok);}
.baseapp-situacao.SEM_ALTERACAO{background:var(--border);color:var(--text-muted);}
.baseapp-situacao.MUDANCA_PAPEL{background:var(--st-limpeza-bg);color:var(--st-limpeza);}
.baseapp-situacao.NOVA_VERSAO{background:var(--st-nitretacao-bg);color:var(--st-nitretacao);}
.baseapp-totais{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;margin-top:6px;color:var(--text);}
.baseapp-diff{margin-top:8px;font-size:13px;padding:8px;border-radius:8px;background:var(--st-nitretacao-bg);color:var(--st-nitretacao);}
.baseapp-orfas{background:var(--st-quebrada-bg);border:1px solid var(--st-quebrada);border-radius:9px;padding:10px 12px;margin:10px 0;color:var(--st-quebrada);font-size:13px;}
.baseapp-orfa-row{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;padding:6px 0;border-top:1px dashed var(--st-quebrada);}
.baseapp-orfa-row:first-of-type{border-top:none;}
.baseapp-ciente{display:flex;align-items:flex-start;gap:8px;font-size:13px;margin:10px 0;padding:10px;border:1px dashed var(--border);border-radius:8px;}
.baseapp-result-row{padding:6px 0;border-bottom:1px dashed var(--border);font-size:13.5px;}
.baseapp-result-row:last-child{border-bottom:none;}
/* ---------- Correção: seções ATUAL/PRÓXIMA/FUTURA/legado ---------- */
.prog-section{margin-bottom:16px;}
.prog-section-head{display:flex;align-items:center;gap:8px;padding:6px 2px;margin-bottom:6px;border-bottom:2px solid var(--border);}
.prog-section-head .lbl{font-weight:800;font-size:13px;letter-spacing:.03em;text-transform:uppercase;}
.prog-section-head .sub{font-size:12px;color:var(--text-muted);}
.prog-section.atual .prog-section-head{border-bottom-color:var(--accent);}
.prog-section.atual .prog-section-head .lbl{color:var(--accent);}
.prog-section.futura{opacity:.92;}
.prog-section-toggle{margin-left:auto;background:none;border:none;color:var(--text-muted);font-size:12px;cursor:pointer;padding:4px 8px;}
.segmented{display:flex;gap:8px;}
.segmented button{
  flex:1;border:1.5px solid var(--border-strong);background:var(--surface);color:var(--text);
  padding:12px 8px;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer;
}
.segmented button.active{background:var(--accent);border-color:var(--accent);color:var(--accent-contrast);}

.btn{
  border:none;border-radius:8px;padding:13px 18px;font-weight:700;font-size:15px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
}
.btn-primary{background:var(--accent);color:var(--accent-contrast);}
.btn-primary:active{background:var(--accent-2);}
.btn-ghost{background:transparent;color:var(--accent);border:1.5px solid var(--border-strong);}
.btn-block{width:100%;}
.btn-danger-text{background:transparent;color:var(--danger);border:none;font-weight:600;font-size:13px;padding:6px 4px;cursor:pointer;}
.btn[disabled]{opacity:.55;cursor:default;}

/* ---------- App chrome ---------- */
.topbar{
  position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);
  padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.topbar .who{display:flex;flex-direction:column;line-height:1.15;min-width:0;}
.topbar .who .name{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.role-pill{
  font-family:"IBM Plex Mono";font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  padding:2px 7px;border-radius:20px;font-weight:600;width:fit-content;margin-top:2px;
}
.role-pill.pcp{background:var(--st-limpeza-bg);color:var(--st-limpeza);}
.role-pill.correcao{background:var(--st-nitretacao-bg);color:var(--st-nitretacao);}
.icon-btn{
  border:1.5px solid var(--border-strong);background:var(--surface);color:var(--text-muted);
  border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;
}

.filterbar{
  position:sticky;top:57px;z-index:19;background:var(--bg);border-bottom:1px solid var(--border);
  padding:10px 16px;display:flex;flex-direction:column;gap:8px;
}
.filterbar .row{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;align-items:center;}
.row-nova{padding-top:2px;}
.btn-add-compact{padding:8px 14px;font-size:13px;}
/* Desktop do PCP: as linhas de filtro (prensa/turno-data/hoje) ficam lado a
   lado numa unica faixa, quebrando so quando nao couberem, em vez de
   empilhadas em 3 linhas cheias -- aproveita a largura e reduz a altura.
   O botao "+ Ferramenta" (antes flutuante sobre a lista) passa a morar
   aqui, compacto, na mesma faixa dos filtros, alinhado a direita. No
   mobile nada disso muda (fica em linha propria, sem flutuar/cobrir). */
@media (min-width:900px){
  .role-pcp .filterbar{flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px 18px;}
  .role-pcp .filterbar .row{width:auto;flex:0 0 auto;overflow-x:visible;padding-bottom:0;}
  .role-pcp .filterbar .row-nova{margin-left:auto;padding-top:0;}
}
.chip{
  border:1.5px solid var(--border-strong);background:var(--surface);color:var(--text-muted);
  padding:7px 13px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;flex:none;
}
.chip.active{background:var(--accent);border-color:var(--accent);color:var(--accent-contrast);}
.filterbar input[type=date]{
  border:1.5px solid var(--border-strong);border-radius:8px;padding:7px 10px;font-size:13.5px;
  background:var(--surface);color:var(--text);font-family:inherit;
}
.busca-input{
  width:100%;box-sizing:border-box;border:1.5px solid var(--border-strong);border-radius:9px;
  padding:8px 12px;font-size:13.5px;background:var(--surface);color:var(--text);font-family:inherit;
}
.busca-input:focus{outline:none;border-color:var(--accent);}
@media (min-width:900px){ .role-pcp .filterbar .row:has(.busca-input){ width:100%; flex:1 1 100%; } }

.content{flex:1;padding:14px 16px 100px;display:flex;flex-direction:column;gap:16px;}
.role-pcp .content{padding-bottom:24px;} /* PCP nao tem mais botao flutuante fixo no rodape (ver row-nova) */

/* ---------- Stat tiles ---------- */
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
@media (min-width:900px){ .role-pcp .stats-grid{grid-template-columns:repeat(6,1fr);} }
.stat-tile{
  background:var(--surface);border:1.5px solid var(--border);border-radius:9px;padding:8px 8px 7px;
  display:flex;flex-direction:column;gap:1px;align-items:flex-start;width:100%;cursor:pointer;
  font-family:inherit;text-align:left;color:var(--text);
}
/* button não herda cor de texto do body em todos os navegadores — sem esta
   linha os cards sem classe de cor (Ferramentas Total / Em Processo)
   caem no preto padrão do navegador, ilegível em tema escuro. */
.stat-tile:hover{border-color:var(--border-strong);background:var(--surface-2);}
.stat-tile .n{font-family:"IBM Plex Mono";font-weight:600;font-size:20px;font-variant-numeric:tabular-nums;line-height:1.15;}
.stat-tile .lbl{font-size:10.5px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
.stat-tile .kg{font-size:10.5px;color:var(--text-faint);font-weight:600;font-variant-numeric:tabular-nums;}
/* Cores dos 6 indicadores — contraste garantido em claro/escuro, cada um
   com uma cor própria e clara (nenhum reaproveita a cor de outro). */
.stat-tile.total .n{color:var(--accent-2);}
.stat-tile.ok .n{color:var(--st-ok);}
.stat-tile.warn .n{color:var(--st-int);}
.stat-tile.indisp .n{color:var(--st-ext);}
.stat-tile.info .n{color:var(--st-limpeza);}
.stat-tile.crit .n{color:var(--st-quebrada);}
.stat-tile.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;background:var(--surface-2);}
.stat-tile.active:hover{background:var(--surface-2);}

/* ---------- PCP view toggle (Macro / Compacta) ---------- */
.view-toggle{display:flex;gap:6px;}
.view-toggle button{
  border:1.5px solid var(--border-strong);background:var(--surface);color:var(--text-muted);
  padding:6px 12px;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;
}
.view-toggle button.active{background:var(--accent);border-color:var(--accent);color:var(--accent-contrast);}

.tool-cards-grid{display:flex;flex-direction:column;gap:10px;}
@media (min-width:900px){ .role-pcp .tool-cards-grid{display:grid;grid-template-columns:repeat(2,1fr);align-items:start;} }
@media (min-width:1300px){ .role-pcp .tool-cards-grid{grid-template-columns:repeat(3,1fr);} }

/* ---------- Compact table (PCP) ---------- */
.compact-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:9px;background:var(--surface);}
table.compact-table{width:100%;border-collapse:collapse;font-size:12.5px;}
table.compact-table th{
  position:sticky;top:0;background:var(--surface-2);text-align:left;font-size:10.5px;text-transform:uppercase;
  letter-spacing:.04em;color:var(--text-faint);font-weight:700;padding:7px 8px;border-bottom:1px solid var(--border);white-space:nowrap;
}
table.compact-table td{padding:5px 8px;border-bottom:1px solid var(--border);white-space:nowrap;vertical-align:middle;}
table.compact-table tbody tr:last-child td{border-bottom:none;}
table.compact-table tbody tr:hover{background:var(--surface-2);}
table.compact-table .codigo{font-family:"IBM Plex Mono";font-weight:700;}
table.compact-table .num{text-align:right;font-family:"IBM Plex Mono";font-variant-numeric:tabular-nums;}
table.compact-table .reserva-row{background:var(--st-int-bg);}
.ct-status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle;}

.section-title{
  font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text-faint);
  display:flex;align-items:center;justify-content:space-between;margin-top:2px;gap:8px;flex-wrap:wrap;
}
.section-title .btn{padding:6px 12px;font-size:11.5px;}

/* ---------- Tool cards (PCP) ---------- */
.tool-card{
  background:var(--surface);border:1px solid var(--border);border-left:5px solid var(--st-pendente);
  border-radius:9px;box-shadow:var(--shadow);overflow:hidden;
}
.tool-card .head{padding:12px 13px 10px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;cursor:pointer;}
.tool-card .id-block{display:flex;flex-direction:column;gap:3px;min-width:0;}
.tool-card .codigo{font-family:"IBM Plex Mono";font-weight:600;font-size:16.5px;letter-spacing:.01em;}
.tool-card .meta{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--text-muted);}
.tag{background:var(--surface-2);border:1px solid var(--border);border-radius:5px;padding:1px 6px;font-weight:600;}
.status-badge{
  font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:20px;white-space:nowrap;height:fit-content;
  text-transform:uppercase;letter-spacing:.02em;
}
.status-badge.sm{font-size:9.5px;padding:3px 7px;}
.tool-card .obs{padding:0 13px 12px;font-size:13px;color:var(--text-muted);line-height:1.4;}
.tool-card .obs b{color:var(--text);font-weight:600;}
.tool-card .foot{
  padding:8px 13px;border-top:1px solid var(--border);display:flex;justify-content:space-between;
  align-items:center;font-size:11.5px;color:var(--text-faint);background:var(--surface-2);
}
.tool-card .foot .prev{font-weight:700;}
.tool-card .body{border-top:1px solid var(--border);padding:12px 13px;display:flex;flex-direction:column;gap:10px;}
/* ---------- Urgência PCP -> Correção ---------- */
/* Botão único, sempre visível — alterna ligar/desligar. Neutro por
   padrão (desligado); só fica vermelho/vivo quando a urgência está
   realmente ATIVA (.active) — nunca antes disso. */
.urgent-btn{
  border:1.5px solid var(--border);background:var(--surface-2);color:var(--text-muted);
  border-radius:8px;padding:4px 9px;font-size:13px;cursor:pointer;flex:none;line-height:1.3;font-weight:700;
}
.urgent-btn.active{
  border-color:var(--st-quebrada);background:var(--st-quebrada-bg);color:var(--st-quebrada);
}
.urgent-bar{
  padding:8px 13px;border-top:1.5px solid var(--st-quebrada);background:var(--st-quebrada-bg);
  display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;
  font-size:12.5px;color:var(--st-quebrada);font-weight:700;
}
.hist-item{display:flex;gap:8px;font-size:12.5px;padding:7px 0;border-bottom:1px dashed var(--border);}
.hist-item:last-child{border-bottom:none;}
.hist-dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex:none;}
.hist-item .who{color:var(--text-faint);}

.empty-state{
  text-align:center;padding:40px 20px;color:var(--text-faint);display:flex;flex-direction:column;gap:6px;
  align-items:center;
}
.empty-state svg{opacity:.5;margin-bottom:4px;}

.batchbar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:640px;
  background:var(--surface);border-top:1px solid var(--border);padding:10px 16px;
  display:flex;gap:8px;align-items:center;z-index:26;box-shadow:0 -2px 10px rgba(20,30,45,.12);
}
@media (max-width:640px){ .batchbar{left:0;transform:none;} }
.batchbar .count{font-weight:700;font-size:13px;flex:1;}
.batchbar .btn{padding:9px 12px;font-size:12.5px;}

/* ---------- Urgência (visão Correção) ---------- */
.urgent-banner{
  background:var(--st-quebrada-bg);border:1.5px solid var(--st-quebrada);border-radius:9px;
  padding:10px 14px;display:flex;flex-direction:column;gap:4px;color:var(--st-quebrada);font-weight:700;font-size:13.5px;
}
.urgent-banner .out-of-filter{font-weight:600;font-size:12px;opacity:.9;}
.nec-row.urgent-nr{background:var(--st-quebrada-bg);border-left:4px solid var(--st-quebrada);}
.nec-row.urgent-rec{background:var(--st-quebrada-bg);border-left:4px solid var(--st-int);}
.nec-row.urgent-pulse{animation:urgentPulse .9s ease-in-out 4;}
@keyframes urgentPulse{

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import {
  getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, addDoc,
  collection, onSnapshot, query, limit, getDocs, increment, arrayUnion, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";
import {
  getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";

/* ============================================================
   CONFIGURAÇÃO DO FIREBASE — COLE AQUI OS DADOS DO SEU PROJETO
   Onde encontrar: console.firebase.google.com > seu projeto >
   ícone de engrenagem > Configurações do projeto > role até
   "Seus apps" > app da Web > "Configuração do SDK".
   ============================================================ */
var FIREBASE_CONFIG = {
  apiKey: "AIzaSyAol3VoiDrcoJe6BdSzDFFU13OZkcwo8SI",
  authDomain: "pcp-correcao.firebaseapp.com",
  projectId: "pcp-correcao",
  storageBucket: "pcp-correcao.firebasestorage.app",
  messagingSenderId: "232457047221",
  appId: "1:232457047221:web:2d6840dd9953f38f81c2fc"
};

window.__FIREBASE_DB_PROMISE = new Promise(function(resolve){
  if(!FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey === "COLE_AQUI"){
    resolve(null);
    return;
  }
  try{
    var app = initializeApp(FIREBASE_CONFIG);
    var fsdb = getFirestore(app);
    var auth = getAuth(app);

    function wrapSnap(snap){ return { exists: snap.exists(), data: function(){ return snap.data(); }, id: snap.id }; }
    function wrapQuerySnap(qs){ return { docs: qs.docs.map(function(d){ return { id:d.id, data:function(){ return d.data(); } }; }) }; }
    function docRef(path){
      var ref = doc(fsdb, path);
      return {
        id: ref.id, path: path,
        get: function(){ return getDoc(ref).then(wrapSnap); },
        set: function(data, opts){ return setDoc(ref, data, opts||{}); },
        update: function(data){ return updateDoc(ref, data); },
        delete: function(){ return deleteDoc(ref); },
        onSnapshot: function(next, err){ return onSnapshot(ref, function(s){ next(wrapSnap(s)); }, err); },
        collection: function(sub){ return collectionRef(path+"/"+sub); }
      };
    }
    function collectionRef(path){
      var ref = collection(fsdb, path);
      return {
        path: path,
        doc: function(id){ return docRef(path+"/"+(id||doc(ref).id)); },
        add: function(data){ return addDoc(ref, data).then(function(r){ return docRef(path+"/"+r.id); }); },
        limit: function(n){
          var q = query(ref, limit(n));
          return {
            get: function(){ return getDocs(q).then(wrapQuerySnap); },
            onSnapshot: function(next, err){ return onSnapshot(q, function(s){ next(wrapQuerySnap(s)); }, err); }
          };
        }
      };
    }

    var dbApi = { doc: docRef, collection: collectionRef, increment: increment, arrayUnion: arrayUnion, serverTimestamp: serverTimestamp };
    var authApi = {
      signUp: function(email, password){ return createUserWithEmailAndPassword(auth, email, password).then(function(cred){ return cred.user.uid; }); },
      signIn: function(email, password){ return signInWithEmailAndPassword(auth, email, password).then(function(cred){ return cred.user.uid; }); },
      signOut: function(){ return signOut(auth); }
    };

    var resolved = false;
    onAuthStateChanged(auth, function(fbUser){
      if(resolved) return;
      resolved = true;
      resolve({ db: dbApi, authApi: authApi, initialUid: fbUser ? fbUser.uid : null });
    });
  }catch(e){
    resolve(null);
  }
});
</script>

<script type="module">
(function(){

var STATUS_META = {
  "Pendente":        {v:"pendente",    label:"Pendente"},
  "OK":              {v:"ok",          label:"OK"},
  "Soda / Limpeza":  {v:"limpeza",     label:"Soda / Limpeza"},
  "Nitretação":      {v:"nitretacao",  label:"Nitretação"},
  "Correção interna":{v:"int",         label:"Correção interna"},
  "Correção externa":{v:"ext",         label:"Correção externa"},
  "Quebrada":        {v:"quebrada",    label:"Quebrada"},
  "Outro":           {v:"outro",       label:"Outro"}
};
var MOTIVO_LIST = ["Soda / Limpeza","Nitretação","Correção interna","Correção externa","Quebrada","Outro"];

function todayStr(d){ d=d||new Date(); var m=("0"+(d.getMonth()+1)).slice(-2), day=("0"+d.getDate()).slice(-2); return d.getFullYear()+"-"+m+"-"+day; }
function addDaysStr(n){ var d=new Date(); d.setDate(d.getDate()+n); return todayStr(d); }
function fmtDateBR(iso){ if(!iso) return "—"; var p=iso.split("-"); return p[2]+"/"+p[1]+"/"+p[0].slice(2); }
function fmtDateTimeBR(iso){ if(!iso) return "—"; var d=new Date(iso); if(isNaN(d)) return "—";
  var dd=("0"+d.getDate()).slice(-2), mm=("0"+(d.getMonth()+1)).slice(-2), hh=("0"+d.getHours()).slice(-2), mi=("0"+d.getMinutes()).slice(-2);
  return dd+"/"+mm+" "+hh+":"+mi; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function fmtKg(n){ n=n||0; return n.toLocaleString("pt-BR",{maximumFractionDigits:1}); }
function fmtFerramentas(n){ return n+" ferramenta"+(n===1?"":"s"); }
function relLabel(iso){
  if(!iso) return "";
  var diff = Math.round((new Date(iso+"T00:00:00") - new Date(todayStr()+"T00:00:00"))/86400000);
  if(diff===0) return "hoje";
  if(diff===1) return "amanhã";
  if(diff>1) return "em "+diff+" dias";
  return fmtDateBR(iso);
}
function sanitizeUsername(u){
  u = (u||"").toString().normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim();
  u = u.replace(/[^a-z0-9._-]+/g,"-").replace(/-+/g,"-").replace(/^[-.]+|[-.]+$/g,"");
  return u.slice(0,60);
}
function usernameToEmail(u){ return u+"@ferramentas.local"; }
function parseKg(raw){
  var s = (raw==null?"":raw).toString().replace(/[^\d.,]/g,"");
  if(s.indexOf(",")>=0 && s.indexOf(".")>=0){ s = s.replace(/\./g,"").replace(",", "."); }
  else if(s.indexOf(",")>=0){ s = s.replace(",", "."); }
  var n = parseFloat(s);
  return isNaN(n)?0:n;
}
function normalizeHeader(s){ return (s==null?"":s).toString().normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase().trim(); }
function autoDetectHeaderRow(grid){
  for(var i=0;i<Math.min(grid.length,12);i++){
    var joined = grid[i].map(normalizeHeader).join("|");
    if(joined.indexOf("FERRAMENTA")>=0) return i;
  }
  return 0;
}
function autoColMap(grid, headerRowIndex){
  var header = grid[headerRowIndex]||[];
  var map = {};
  header.forEach(function(cell,idx){
    var h = normalizeHeader(cell);
    if(map.codigo===undefined && /FERRAMENTA/.test(h)) map.codigo=idx;
    else if(map.cliente===undefined && /CLIENTE/.test(h)) map.cliente=idx;
    else if(map.quantidadeKg===undefined && /QUANT/.test(h)) map.quantidadeKg=idx;
    else if(map.corte===undefined && /CORTE/.test(h)) map.corte=idx;
    else if(map.liga===undefined && /^LIGA/.test(h)) map.liga=idx;
    else if(map.observacaoPCP===undefined && /OBSERV/.test(h)) map.observacaoPCP=idx;
  });
  return map;
}
function classifyRows(grid, headerRowIndex){
  var rows = [];
  var afterReserva = false;
  for(var i=headerRowIndex+1;i<grid.length;i++){
    var cells = grid[i]||[];
    var joined = cells.map(function(c){return (c==null?"":c.toString());}).join(" ").trim();
    var norm = normalizeHeader(joined);
    if(norm===""){ continue; }
    if(norm.indexOf("PROGRAMACAO RESERVA")>=0 || norm==="RESERVA"){ rows.push({index:i,cells:cells,kind:"divider",label:"Programação Reserva"}); afterReserva=true; continue; }
    if(/^TOTAL\b/.test(norm)){ rows.push({index:i,cells:cells,kind:"divider",label:"Total"}); continue; }
    if(norm.indexOf("FERRAMENTA")>=0 && norm.indexOf("CLIENTE")>=0){ rows.push({index:i,cells:cells,kind:"divider",label:"Cabeçalho repetido"}); continue; }
    rows.push({index:i, cells:cells, kind:"data", tipo: afterReserva? "Reserva":"Programação"});
  }
  return rows;
}

/* ---- Consolidation key (code + prensa + data). Used both client-side
   (PCP dashboard, which has full "ferramentas" access) and as the
   Firestore doc id in "necessidades" / "status". ---- */
// programacaoId é o 4º parâmetro, OPCIONAL: chamadas com 3 argumentos
// (todo o código legado) continuam gerando exatamente a mesma chave de
// sempre — undefined/null/"" nunca entram na chave. Só quando um valor
// real é passado (registros de uma nova programação, Etapa 3 em diante)
// a chave ganha o sufixo "__<programacaoId>", isolando completamente
// aquela ocorrência de qualquer outra com o mesmo código+prensa+data.
function necDocId(codigo, prensa, data, programacaoId){
  var c = (codigo||"").toString().normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase().replace(/[^A-Z0-9._-]+/g,"-").replace(/-+/g,"-").replace(/^-+|-+$/g,"");
  var base = (c||"X") + "__" + (prensa||"X") + "__" + (data||"X");
  return programacaoId ? base + "__" + programacaoId : base;
}
function computeNecessidades(list){
  var groups = {};
  list.forEach(function(t){
    var key = necDocId(t.codigo, t.prensa, t.dataProgramacao, t.programacaoId);
    if(!groups[key]) groups[key] = { key:key, codigo:t.codigo, prensa:t.prensa, data:t.dataProgramacao, programacaoId: t.programacaoId||null, kgTotal:0, kgProgramacao:0, kgReserva:0, observacoes:[], rawIds:[] };
    var g = groups[key];
    var kg = t.quantidadeKg||0;
    g.kgTotal += kg;
    if(t.tipo==="Reserva") g.kgReserva += kg; else g.kgProgramacao += kg;
    if(t.observacaoPCP && g.observacoes.indexOf(t.observacaoPCP)===-1) g.observacoes.push(t.observacaoPCP);
    g.rawIds.push(t.id);
  });
  return Object.keys(groups).map(function(k){return groups[k];});
}
function sortNec(list){ return list.slice().sort(function(a,b){ return (a.codigo||"").localeCompare(b.codigo||""); }); }
// Prioridade visual da Correção: 1º urgências ativas não reconhecidas,
// 2º urgências ativas já reconhecidas, 3º as demais — preservando a
// ordenação alfabética já existente dentro de cada grupo.
function urgRank(key){
  var u = state.urgenciasByKey[key];
  if(!(u && u.urgente)) return 2;
  return u.reconhecida ? 1 : 0;
}
function sortNecComUrgencia(list){
  return sortNec(list).sort(function(a,b){ return urgRank(a.key)-urgRank(b.key); });
}

/* ================= AUDITORIA DE NECESSIDADES (somente leitura) =================
   Recalcula as necessidades a partir dos registros hoje existentes em
   "ferramentas" (reaproveitando computeNecessidades, a mesma função usada
   em todo o resto do app) e compara com o que está gravado em
   "necessidades", sinalizando divergências. NÃO grava nada — é usada só
   para diagnóstico antes de qualquer decisão de correção.

   Comportamento investigado e encontrado para registros RETIRADA (não
   assumido): a coleção "ferramentas" NÃO tem nenhum campo que marque um
   registro como retirado — as regras do Firestore proíbem update nela
   (allow update: if false) e o app nunca exclui automaticamente um
   registro RETIRADA (mantido de propósito para auditoria/histórico do
   PCP). Ou seja: não existe, hoje, NENHUM jeito de distinguir dentro de
   "ferramentas" um registro que ainda representa a programação real de um
   registro que já saiu do Espelho em uma sincronização anterior — os dois
   têm exatamente a mesma cara. Por isso este recálculo soma TODOS os
   registros de "ferramentas" que batem com cada código+prensa+data (é a
   única fonte disponível), e o resultado é rotulado com essa ressalva na
   tela: uma divergência encontrada aqui pode ser (a) kg que nunca foi
   decrementado da necessidade (o bug já corrigido no sincronizador), OU
   (b) um registro "ferramentas" antigo, de fato retirado há muito tempo,
   que nunca foi removido e por isso ainda entra na soma. Esta auditoria
   não tem como diferenciar os dois casos sozinha — só uma nova
   sincronização do Espelho (comparando contra a planilha real) consegue
   confirmar qual registro específico não faz mais parte da programação
   atual. Por isso a correção não é executada automaticamente. */
function computeAuditResult(ferramentas, existingMap){
  var recalcedByKey = {};
  computeNecessidades(ferramentas).forEach(function(g){ recalcedByKey[g.key] = g; });
  var allKeys = {};
  Object.keys(existingMap).forEach(function(k){ allKeys[k]=true; });
  Object.keys(recalcedByKey).forEach(function(k){ allKeys[k]=true; });

  var rows = [];
  var summary = { total:0, semAlteracao:0, aCorrigir:0, aCriar:0, semCorrespondente:0, diffKgAbsTotal:0 };
  var STATUS_KEY_MAP = { SEM_ALTERACAO:"semAlteracao", A_CORRIGIR:"aCorrigir", A_CRIAR:"aCriar", SEM_CORRESPONDENTE:"semCorrespondente" };
  Object.keys(allKeys).forEach(function(key){
    var existing = existingMap[key];
    var rec = recalcedByKey[key];
    var existingKg = existing ? (existing.kgTotal||0) : 0;
    var existingCount = existing ? (existing.count||0) : 0;
    var recKg = rec ? rec.kgTotal : 0;
    var recCount = rec ? rec.rawIds.length : 0;
    var diff = Math.round((recKg - existingKg) * 100) / 100;
    var status;
    if(!existing && rec){ status = "A_CRIAR"; }
    else if(existing && !rec){ status = "SEM_CORRESPONDENTE"; }
    else if(Math.abs(diff) > 0.01 || existingCount !== recCount){ status = "A_CORRIGIR"; }
    else { status = "SEM_ALTERACAO"; }
    summary.total++;
    summary[STATUS_KEY_MAP[status]]++;
    summary.diffKgAbsTotal += Math.abs(diff);
    var parts = key.split("__");
    rows.push({
      key: key,
      codigo: (rec && rec.codigo) || (existing && existing.codigo) || parts[0],
      prensa: (rec && rec.prensa) || (existing && existing.prensa) || parts[1],
      data: (rec && rec.data) || (existing && existing.data) || parts[2],
      programacaoId: (rec && rec.programacaoId) || (existing && existing.programacaoId) || null,
      status: status, existingKg: existingKg, existingCount: existingCount, recKg: recKg, recCount: recCount, diff: diff,
      rawRows: ferramentas.filter(function(t){ return necDocId(t.codigo,t.prensa,t.dataProgramacao,t.programacaoId)===key; })
    });
  });
  var ORDER = { A_CORRIGIR:0, A_CRIAR:1, SEM_CORRESPONDENTE:2, SEM_ALTERACAO:3 };
  rows.sort(function(a,b){
    if(ORDER[a.status]!==ORDER[b.status]) return ORDER[a.status]-ORDER[b.status];
    return (a.codigo||"").localeCompare(b.codigo||"");
  });
  return { rows: rows, summary: summary };
}
function runAudit(){
  if(!state.db){ state.audit.loading=false; state.audit.error="Serviço de dados indisponível."; render(); return; }
  state.db.collection("necessidades").limit(2000).get().then(function(snap){
    var existingMap = {};
    snap.docs.forEach(function(d){
      if(d.id===SYNC_META_DOC_ID) return;
      existingMap[d.id] = d.data();
    });
    state.audit.loading = false;
    state.audit.result = computeAuditResult(state.ferramentas, existingMap);
    render();
  }).catch(function(err){
    state.audit.loading = false;
    state.audit.error = "Erro ao carregar necessidades para auditoria: "+(err&&err.message||"");
    render();
  });
}

// Campos de texto que filtram em tempo real (a cada tecla) precisam
// preservar foco/posição do cursor através do re-render por innerHTML —
// sem isso, cada tecla digitada "pula" o cursor pro fim do campo.
var LIVE_TEXT_INPUT_IDS = ["filter-busca"];
function render(){
  var focusId = null, selStart = null, selEnd = null;
  var active = document.activeElement;
  if(active && LIVE_TEXT_INPUT_IDS.indexOf(active.id)>=0){
    focusId = active.id; selStart = active.selectionStart; selEnd = active.selectionEnd;
  }
  // Trava/destrava o scroll da página de fundo em sincronia com state.modal,
  // em TODA renderização — como render() roda depois de qualquer mudança de
  // estado (inclusive ao fechar um modal), isso nunca deixa o scroll preso.
  document.documentElement.classList.toggle("modal-open", !!state.modal);
  document.body.classList.toggle("modal-open", !!state.modal);
  if(!state.user){ app.className=""; app.innerHTML = renderAuth(); bindAuth(); return; }
  app.className = state.user.perfil==="pcp" ? "role-pcp" : "role-correcao";
  if(!state.dbReady){ app.innerHTML = '<div class="spinner-wrap">CARREGANDO…</div>'; return; }
  var filterBarHtml = state.user.perfil==="pcp" ? renderFilterBarPCP() : renderFilterBarCorrecao();
  var html = renderTopBar() + filterBarHtml + '<div class="content">' +
    (state.user.perfil==="pcp" ? renderPCP() : renderCorrecao()) +
    '</div>';
  if(state.modal) html += renderModal();
  if(state.toast) html += '<div class="toast">'+esc(state.toast)+'</div>';
  app.innerHTML = html;
  bindApp();
  if(focusId){
    var el = document.getElementById(focusId);
    if(el){ el.focus(); try{ el.setSelectionRange(selStart, selEnd); }catch(e){} }
  }
  if(state.toast){ setTimeout(function(){ state.toast=null; var t=app.querySelector(".toast"); if(t) t.remove(); },2200); }
}

function bindAuth(){
  app.querySelectorAll("[data-auth-tab]").forEach(function(b){
    b.addEventListener("click",function(){ state.authMode=b.getAttribute("data-auth-tab"); state.authError=""; render(); });
  });
  app.querySelectorAll("[data-role-opt]").forEach(function(b){
    b.addEventListener("click",function(){ state.regRole=b.getAttribute("data-role-opt"); render(); });
  });
  var lf = document.getElementById("login-form");
  if(lf) lf.addEventListener("submit", function(e){ e.preventDefault(); doLogin(); });
  var rf = document.getElementById("register-form");
  if(rf) rf.addEventListener("submit", function(e){ e.preventDefault(); doRegister(); });
}

function friendlyAuthError(err){
  var code = err && err.code;
  if(code==="auth/invalid-credential" || code==="auth/wrong-password" || code==="auth/user-not-found") return "Usuário ou senha incorretos.";
  if(code==="auth/email-already-in-use") return "Este usuário já existe. Tente entrar.";
  if(code==="auth/weak-password") return "A senha deve ter ao menos 6 caracteres.";
  if(code==="auth/network-request-failed") return "Sem conexão com o servidor. Tente novamente.";
  return (err && err.message) || "Tente novamente.";
}

function doLogin(){
  var user = sanitizeUsername(document.getElementById("li-user").value);
  var pass = document.getElementById("li-pass").value;
  if(!user || !pass){ state.authError="Preencha usuário e senha."; render(); return; }
  if(!state.db || !window.__AUTH_API){ state.authError="Serviço de dados indisponível no momento. Veja o painel de configuração abaixo."; render(); return; }
  state.authBusy=true; state.authError=""; render();
  window.__AUTH_API.signIn(usernameToEmail(user), pass).then(function(uid){
    return state.db.doc("users/"+uid).get().then(function(snap){
      state.authBusy=false;
      if(!snap.exists){ state.authError="Perfil não encontrado para este usuário."; render(); return; }
      var data = snap.data();
      state.user = { uid:uid, username:user, nome:data.nome, perfil:data.role };
      render(); startSubs();
    });
  }).catch(function(err){ state.authBusy=false; state.authError=friendlyAuthError(err); render(); });
}

function doRegister(){
  var nome = document.getElementById("re-nome").value.trim();
  var user = sanitizeUsername(document.getElementById("re-user").value);
  var pass = document.getElementById("re-pass").value;
  if(!nome || !user || !pass){ state.authError="Preencha todos os campos."; render(); return; }
  if(pass.length<6){ state.authError="A senha deve ter ao menos 6 caracteres."; render(); return; }
  if(!state.db || !window.__AUTH_API){ state.authError="Serviço de dados indisponível no momento. Veja o painel de configuração abaixo."; render(); return; }
  state.authBusy=true; state.authError=""; render();
  window.__AUTH_API.signUp(usernameToEmail(user), pass).then(function(uid){
    return state.db.doc("users/"+uid).set({ nome:nome, role:state.regRole, criadoEm:new Date().toISOString() }).then(function(){
      state.authBusy=false;
      state.user = { uid:uid, username:user, nome:nome, perfil:state.regRole };
      render(); startSubs();
    });
  }).catch(function(err){ state.authBusy=false; state.authError=friendlyAuthError(err); render(); });
}

function logout(){
  if(window.__AUTH_API) window.__AUTH_API.signOut();
  state.user=null; state.ferramentas=[]; state.dataLoaded=false; state.statusByKey={}; state.necessidadesByKey={}; state.necPending={};

}

/* ================= PROGRAMAÇÃO ATIVA (Etapa 3) =================
   isRecordActive decide se um registro pertence à programação
   operacionalmente vigente. Duas situações:

   1) Registro já pertence à nova arquitetura (programacaoId presente):
      é ativo se e somente se o doc programacoes/{programacaoId}
      correspondente existir e estiver com vigente===true. Cobre atual/
      próxima/futura ao mesmo tempo — não existe mais um único ponteiro.

   2) Registro do LEGADO (sem programacaoId): continua ativo até que o
      MESMO slot (data [+turno, quando conhecido]) seja efetivamente
      coberto por uma programação vigente da nova arquitetura. Nenhuma
      migração em massa — cada slot só some quando uma programação real
      o substitui. `turno` é opcional (necessidades consolidadas não o
      carregam, de propósito — Reserva/Programação do mesmo dia sempre
      convergem); quando omitido, qualquer programação vigente naquela
      data já basta para considerar o slot substituído (mais conservador
      = nunca deixa status desatualizado visível por engano).

   Enquanto nenhum doc de programacoes existir (estado de hoje, antes da
   primeira importação BASE_APP), é sempre true para tudo — comportamento
   idêntico à v1.2. */
function isRecordActive(programacaoId, data, turno){
  if(programacaoId){
    var p = state.programacoesByKey[programacaoId];
    return !!(p && p.vigente);
  }
  var keys = Object.keys(state.programacoesByKey);
  for(var i=0;i<keys.length;i++){
    var pr = state.programacoesByKey[keys[i]];
    if(!pr.vigente) continue;
    if(pr.data!==data) continue;
    if(turno && pr.turno!==turno) continue;
    return false;
  }
  return true;
}

/* ================= DATA HELPERS ================= */
// Filtros "base": prensa/turno/data/reserva. Não inclui onlyPend nem o
// indicador clicável — usados isoladamente para o cálculo dos indicadores
// (que precisam responder aos mesmos filtros de prensa/turno/data/reserva,
// mas calculam sua PRÓPRIA quebra por status, então não podem já vir
// pré-filtrados por status).
function applyBaseFilters(list){
  var f = state.filters;
  return list.filter(function(t){
    if(f.prensa!=="Todas" && t.prensa!==f.prensa) return false;
    if(f.turno!=="Todos" && t.turno!==f.turno) return false;
    if(f.data!=="__all__" && t.dataProgramacao!==f.data) return false;
    if(f.reservaOnly){ if(t.tipo!=="Reserva") return false; }
    else if(t.tipo==="Reserva") return false;
    if(!isRecordActive(t.programacaoId, t.dataProgramacao, t.turno)) return false;
    return true;
  });
}
// Filtro usado SÓ pelos indicadores do PCP (os 6 cards). Prensa/turno/data
// funcionam igual a applyBaseFilters, mas Reserva é tratada de forma
// DIFERENTE de propósito: reservaOnly=true estreita para só as
// necessidades alimentadas por linha(s) de Reserva (igual à lista de
// registros); reservaOnly=false (padrão) NÃO exclui Reserva — os
// indicadores precisam refletir o MESMO universo de necessidades
// consolidadas que a Correção enxerga, e a Correção nunca separa
// Reserva de Programação dentro de uma necessidade (upsertNecessidadeDelta
// soma as duas no mesmo doc). Causa raiz da divergência 32×44: com
// applyBaseFilters, reservaOnly=false excluía TODA linha de Reserva —
// necessidades compostas 100% por Reserva desapareciam por completo do
// total do PCP, e necessidades mistas (Programação+Reserva) ficavam com
// kg subcontado. Isso é intencionalmente diferente de applyBaseFilters,
// que CONTINUA ocultando Reserva por padrão — usada só pela lista de
// registros brutos (Macro/Compacta), comportamento já aprovado e
// testado anteriormente, e que não muda aqui.
function applyFiltersForIndicators(list){
  var f = state.filters;
  return list.filter(function(t){
    if(f.prensa!=="Todas" && t.prensa!==f.prensa) return false;
    if(f.turno!=="Todos" && t.turno!==f.turno) return false;
    if(f.data!=="__all__" && t.dataProgramacao!==f.data) return false;
    if(f.reservaOnly && t.tipo!=="Reserva") return false;
    if(!isRecordActive(t.programacaoId, t.dataProgramacao, t.turno)) return false;
    return true;
  });
}
// Status efetivo (por necessidade) agrupado nos 4 grupos usados pelos
// indicadores do PCP: ok / pendente / indisponivel / quebrada.
// "Quebrada" também conta como indisponível (é um subconjunto), mas tem
// seu próprio indicador dedicado.
function necStatusGroup(status){
  var v = (STATUS_META[status]||STATUS_META["Pendente"]).v;
  if(v==="ok") return "ok";
  if(v==="pendente") return "pendente";
  if(v==="quebrada") return "quebrada";
  return "indisponivel"; // limpeza, nitretacao, int, ext, outro
}
// Busca (PCP): ferramenta + cliente + prensa, acento/maiúscula-insensível
// (reaproveita normalizeHeader), combinada com os demais filtros — nunca
// os substitui. Não afeta os indicadores (applyFiltersForIndicators), só
// a lista de registros visível.
function matchesBusca(codigo, cliente, prensa, buscaNorm){
  if(!buscaNorm) return true;
  var alvo = normalizeHeader(codigo) + " " + normalizeHeader(cliente||"") + " " + normalizeHeader(prensa||"");
  return alvo.indexOf(buscaNorm) >= 0;
}
function applyFilters(list){
  var f = state.filters;
  var out = applyBaseFilters(list).filter(function(t){
    if(f.onlyPend){
      var sd = state.statusByKey[necDocId(t.codigo,t.prensa,t.dataProgramacao,t.programacaoId)];
      if(sd && sd.status==="OK") return false;
    }
    return true;
  });
  if(f.indicador){
    out = out.filter(function(t){
      var sd = state.statusByKey[necDocId(t.codigo,t.prensa,t.dataProgramacao,t.programacaoId)];
      var status = sd ? sd.status : "Pendente";
      var grp = necStatusGroup(status);
      if(f.indicador==="emprocesso") return grp!=="ok";
      return grp===f.indicador;
    });
  }
  if(f.busca){
    var buscaNorm = normalizeHeader(f.busca);
    out = out.filter(function(t){ return matchesBusca(t.codigo, t.cliente, t.prensa, buscaNorm); });
  }
  return out;
}
// Indicadores do PCP: contam NECESSIDADES (código+prensa+data, sem duplicar
// pelas linhas brutas da programação — ver computeNecessidades), dentro dos
// filtros de prensa/turno/data/reserva atualmente ativos (mas ignorando
// onlyPend/indicador, que são o próprio resultado deste cálculo).
function computeIndicators(rawList){
  var necs = computeNecessidades(rawList);
  var ind = {
    total:{n:0,kg:0}, ok:{n:0,kg:0}, pendente:{n:0,kg:0}, indisponivel:{n:0,kg:0}, emprocesso:{n:0,kg:0}, quebrada:{n:0,kg:0}
  };
  necs.forEach(function(g){
    var sd = state.statusByKey[g.key];
    var status = sd ? sd.status : "Pendente";
    var grp = necStatusGroup(status);
    ind.total.n++; ind.total.kg += g.kgTotal;
    ind[grp].n++; ind[grp].kg += g.kgTotal;
    if(grp!=="ok"){ ind.emprocesso.n++; ind.emprocesso.kg += g.kgTotal; }
  });
  return ind;
}
// Formata o timestamp do SERVIDOR (Firestore Timestamp, com .toDate()) da
// última sincronização bem-sucedida do Espelho, sempre em horário de
// São Paulo — independente do fuso do aparelho de quem está vendo.
// Aceita também um Date puro (usado pelos testes com mock).
function fmtSyncUpdatedBR(ts){
  if(!ts) return null;
  var d = (ts && typeof ts.toDate === "function") ? ts.toDate() : (ts instanceof Date ? ts : new Date(ts));
  if(!d || isNaN(d.getTime())) return null;
  var parts = new Intl.DateTimeFormat("pt-BR", {
    timeZone: "America/Sao_Paulo", day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit", hour12:false
  }).formatToParts(d);
  var map = {};
  parts.forEach(function(p){ map[p.type] = p.value; });
  return map.day+"/"+map.month+"/"+map.year+" às "+map.hour+":"+map.minute;
}
function sortTools(list){
  return list.slice().sort(function(a,b){
    if(a.prensa!==b.prensa) return a.prensa<b.prensa?-1:1;
    if(a.turno!==b.turno) return a.turno==="Dia"?-1:1;
    return (a.codigo||"").localeCompare(b.codigo||"");
  });
}
function effectiveNecStatus(key){
  if(state.necPending[key]) return state.necPending[key];
  var sd = state.statusByKey[key];
  return sd ? { status: sd.status, previsaoLiberacao: sd.previsaoLiberacao||null, observacaoCorrecao: sd.observacaoCorrecao||"" }
            : { status:"Pendente", previsaoLiberacao:null, observacaoCorrecao:"" };
}

    statTile("Indisponíveis", "indisponivel", ind.indisponivel, "indisp", f.indicador==="indisponivel") +
    statTile("Em processo", "emprocesso", ind.emprocesso, "info", f.indicador==="emprocesso") +

function historyBlock(items){

      '<span class="hist-dot" style="background:var(--st-'+m.v+');"></span>' +

}

/* ================= CORREÇÃO VIEW (consolidated, compact) ================= */
function getCorrecaoGroups(){
  var f = state.filters;
  var all = Object.keys(state.necessidadesByKey).map(function(k){
    var d = state.necessidadesByKey[k];
    var prog = d.programacaoId ? state.programacoesByKey[d.programacaoId] : null;
    return {
      key:k, codigo:d.codigo, prensa:d.prensa, data:d.data, programacaoId: d.programacaoId||null,
      papel: prog ? prog.papel : "legado",
      kgTotal:d.kgTotal||0, kgProgramacao:d.kgProgramacao||0, kgReserva:d.kgReserva||0,
      observacoes:d.observacoes||[], clientes:d.clientes||[], count:d.count||0
    };
  });
  var buscaNorm = normalizeHeader(f.busca||"");
  var scoped = all.filter(function(g){
    if(state.correcaoPrensa!=="Todas" && g.prensa !== state.correcaoPrensa) return false;
    if(f.data!=="__all__" && g.data !== f.data) return false;
    // necessidades consolidadas não carregam turno de propósito (Reserva/
    // Programação do mesmo dia convergem no mesmo doc) — por isso não dá
    // pra passar turno aqui; ver nota em isRecordActive.
    if(!isRecordActive(g.programacaoId, g.data, null)) return false;
    if(buscaNorm && !matchesBusca(g.codigo, g.clientes.join(" "), g.prensa, buscaNorm)) return false;
    return true;
  });
  return sortNecComUrgencia(scoped);
}
// Urgências ativas (urgente:true) que caem FORA da lista atualmente
// visível (por causa do filtro de prensa/data) não podem se misturar nos
// resultados — mas o banner avisa que elas existem, para não passarem
// despercebidas. As que ESTÃO na lista visível aparecem nominalmente.
function renderUrgentBanner(visibleGroups){
  var activeKeys = Object.keys(state.urgenciasByKey).filter(function(k){ return state.urgenciasByKey[k].urgente; });
  if(!activeKeys.length) return "";
  var visibleKeys = {};
  visibleGroups.forEach(function(g){ visibleKeys[g.key]=true; });
  var inFilter = activeKeys.filter(function(k){ return visibleKeys[k]; });
  var outFilter = activeKeys.filter(function(k){ return !visibleKeys[k]; });
  var html = '<div class="urgent-banner">';
  if(inFilter.length){
    var codigos = inFilter.map(function(k){ return state.urgenciasByKey[k].codigo; });
    html += '<div>🚨 '+inFilter.length+' URGÊNCIA'+(inFilter.length>1?"S":"")+' DO PCP — '+esc(codigos.join(", "))+'</div>';
  }
  if(outFilter.length){
    html += '<div class="out-of-filter">🚨 Existe'+(outFilter.length>1?"m "+outFilter.length+" urgências ativas":" 1 urgência ativa")+' fora do filtro atual.</div>';
  }
  html += '</div>';
  return html;
}

// Seções ATUAL/PRÓXIMA/FUTURA/legado (Etapa 3). Enquanto só existir 1
// papel entre as necessidades visíveis (o caso de hoje, antes de
// qualquer importação BASE_APP: tudo é "legado"), renderiza uma lista
// plana idêntica à de sempre — nenhuma mudança visual até que exista
// pelo menos uma programação real da nova arquitetura ao lado do
// legado. Nunca mistura papéis diferentes na mesma seção; vermelho
// continua reservado só para urgência (ver .urgent-* em outro lugar),
// nunca usado aqui para diferenciar ATUAL/PRÓXIMA/FUTURA.
var CORRECAO_SECOES = [
  { papel:"atual",   titulo:"Programação atual" },
  { papel:"proxima", titulo:"Próxima programação" },
  { papel:"futura",  titulo:"Programação futura", recolhivel:true },
  { papel:"legado",  titulo:"Outras ferramentas" }
];
function renderCorrecaoSections(visibleGroups){
  var rowFn = state.correcaoView==="compacta" ? renderNecRowCompact : renderNecRow;
  var listClass = state.correcaoView==="compacta" ? "nec-list nec-list-compact" : "nec-list";
  var byPapel = {};
  visibleGroups.forEach(function(g){
    var p = g.papel || "legado";
    if(!byPapel[p]) byPapel[p] = [];
    byPapel[p].push(g);
  });
  var papeisPresentes = Object.keys(byPapel);
  if(papeisPresentes.length<=1){
    return '<div class="'+listClass+'">' + visibleGroups.map(rowFn).join("") + '</div>';
  }
  return CORRECAO_SECOES.map(function(sec){
    var itens = byPapel[sec.papel];
    if(!itens || !itens.length) return "";
    // FUTURA começa recolhida por padrão (evita poluição visual); as
    // demais seções começam sempre abertas. state.correcaoSecaoRecolhida
    // só guarda o que o usuário já alternou manualmente nesta sessão.
    var jaAlternada = state.correcaoSecaoRecolhida.hasOwnProperty(sec.papel);
    var recolhida = jaAlternada ? state.correcaoSecaoRecolhida[sec.papel] : !!sec.recolhivel;
    var html = '<div class="prog-section '+sec.papel+'">';
    html += '<div class="prog-section-head"><span class="lbl">'+esc(sec.titulo)+'</span><span class="sub">'+itens.length+' ferramenta(s)</span>' +
      (sec.recolhivel ? '<button type="button" class="prog-section-toggle" data-action="toggle-prog-secao" data-papel="'+sec.papel+'">'+(recolhida?"Mostrar":"Recolher")+'</button>' : '') +
    '</div>';
    if(!recolhida) html += '<div class="'+listClass+'">' + itens.map(rowFn).join("") + '</div>';
    html += '</div>';
    return html;
  }).join("");
}
function renderNecRow(g){
  var key = g.key;
  var eff = effectiveNecStatus(key);
  var meta = STATUS_META[eff.status] || STATUS_META["Pendente"];
  var pending = !!state.necPending[key];
  var expanded = !!state.necExpanded[key];
  var isOk = eff.status==="OK";
  var urg = state.urgenciasByKey[key];
  var isUrgent = !!(urg && urg.urgente);
  var isPulsing = isUrgent && !urg.reconhecida && (state.urgentPulseUntil[key]||0) > Date.now();
  var rowClass = pending ? "pending" : "";
  if(isUrgent) rowClass += " " + (urg.reconhecida ? "urgent-rec" : "urgent-nr") + (isPulsing ? " urgent-pulse" : "");

    html += '<div class="prev-grid">' +
      necPrevChip("+1",addDaysStr(1),eff.previsaoLiberacao,key) +
      necPrevChip("+2",addDaysStr(2),eff.previsaoLiberacao,key) +
      necPrevChip("+3",addDaysStr(3),eff.previsaoLiberacao,key) +
      '<button type="button" class="prev-opt '+(eff.previsaoLiberacao?"":"selected")+'" data-action="set-nec-prev" data-key="'+key+'" data-value="">Sem previsão</button>' +
    '</div>';
    html += '<textarea data-action="nec-obs-input" data-key="'+key+'" placeholder="Observação da Correção (opcional)">'+esc(eff.observacaoCorrecao||"")+'</textarea>';

    html += '</div>';
  }
  html += '</div>';
  return html;

      '<div class="hint">Depois de escolher o arquivo, você poderá conferir e ajustar as colunas antes de importar.</div>' +
      (imp.loading ? '<div class="hint">Lendo arquivo…</div>' : '') +
      (imp.error ? '<div class="error-msg">'+esc(imp.error)+'</div>' : '');
  } else {
    var grid = imp.grid;
    var rows = classifyRows(grid, imp.headerRowIndex);
    var dataRows = rows.filter(function(r){return r.kind==="data";});
    var selCount = dataRows.filter(function(r){ return imp.rowChecked[r.index]!==false; }).length;
    var headerRow = grid[imp.headerRowIndex]||[];

    body += (imp.sheetNames && imp.sheetNames.length>1 ? '<div class="field"><label>Aba da planilha</label><select id="imp-sheet">' +
      imp.sheetNames.map(function(n){ return '<option value="'+esc(n)+'" '+(n===imp.sheetName?"selected":"")+'>'+esc(n)+'</option>'; }).join("") +
      '</select></div>' : '');

    body += '<div class="field"><label>Esse grupo é de</label>' +
      '<div class="segmented">' +
        '<button type="button" data-imp="prensa" data-value="P4" class="'+(imp.prensa==="P4"?"active":"")+'">P4</button>' +
        '<button type="button" data-imp="prensa" data-value="P7" class="'+(imp.prensa==="P7"?"active":"")+'">P7</button>' +
      '</div>' +
      '<div class="segmented" style="margin-top:8px;">' +
        '<button type="button" data-imp="turno" data-value="Dia" class="'+(imp.turno==="Dia"?"active":"")+'">☀ Dia</button>' +
        '<button type="button" data-imp="turno" data-value="Noite" class="'+(imp.turno==="Noite"?"active":"")+'">☾ Noite</button>' +
      '</div>' +
    '</div>';
    body += '<div class="field"><label>Data da programação</label><input id="imp-data" type="date" value="'+imp.data+'"></div>';

    body += '<div class="field"><label>Linha do cabeçalho</label><select id="imp-header">' +
      grid.slice(0, Math.min(grid.length,15)).map(function(row,i){
        var preview = row.slice(0,4).join(" · ").slice(0,44) || "(vazia)";
        return '<option value="'+i+'" '+(i===imp.headerRowIndex?"selected":"")+'>Linha '+(i+1)+': '+esc(preview)+'</option>';
      }).join("") + '</select></div>';

    body += '<div class="field"><label>Colunas da planilha</label><div style="display:flex;flex-direction:column;gap:8px;">' +
      colSelect("codigo","Código *",headerRow,imp.colMap) +
      colSelect("cliente","Cliente",headerRow,imp.colMap) +
      colSelect("quantidadeKg","Quantidade (kg) *",headerRow,imp.colMap) +
      colSelect("corte","Corte",headerRow,imp.colMap) +
      colSelect("liga","Liga",headerRow,imp.colMap) +
      colSelect("observacaoPCP","Observação",headerRow,imp.colMap) +
    '</div></div>';

    body += '<div class="field"><label>Linhas a importar ('+selCount+' de '+dataRows.length+')</label>' +
      '<div style="border:1px solid var(--border);border-radius:8px;max-height:260px;overflow:auto;">' +
      rows.map(function(r){
        if(r.kind==="divider"){
          return '<div style="padding:6px 10px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text-faint);background:var(--surface-2);">— '+esc(r.label)+' —</div>';
        }
        var checked = imp.rowChecked[r.index]!==false;
        var tipo = imp.rowTipoOverride[r.index] || r.tipo;
        function c(field){ var idx=imp.colMap[field]; return idx===undefined?"":(r.cells[idx]||""); }
        return '<label style="display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--border);font-size:12.5px;'+(checked?"":"opacity:.4;")+'">' +
          '<input type="checkbox" data-action="imp-row-toggle" data-idx="'+r.index+'" '+(checked?"checked":"")+'>' +
          '<span class="mono" style="font-weight:600;min-width:70px;">'+esc(c("codigo")||"—")+'</span>' +
          '<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-muted);">'+esc(c("cliente"))+'</span>' +
          '<span class="mono" style="min-width:40px;text-align:right;">'+esc(c("quantidadeKg"))+'</span>' +
          '<button type="button" data-action="imp-row-tipo" data-idx="'+r.index+'" class="prev-opt '+(tipo==="Reserva"?"selected":"")+'" style="padding:3px 8px;font-size:10.5px;">'+(tipo==="Reserva"?"Reserva":"Progr.")+'</button>' +
        '</label>';
      }).join("") +
      '</div>' +
    '</div>';

    var docs = buildImportDocs();
    var progCount = docs.filter(function(d){return d.tipo!=="Reserva";}).length;
    var resCount = docs.filter(function(d){return d.tipo==="Reserva";}).length;
    var necCount = computeNecessidades(docs).length;
    body += '<div class="hint" style="background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;">' +
      '<b style="color:var(--text);">Prévia:</b> '+docs.length+' registro(s) · '+progCount+' programação / '+resCount+' reserva · '+necCount+' ferramenta(s) única(s) na '+esc(imp.prensa)+'.' +
    '</div>';

    var conflictCount = state.ferramentas.filter(function(t){return t.prensa===imp.prensa && t.turno===imp.turno && t.dataProgramacao===imp.data;}).length;
    if(conflictCount>0){
      body += '<div class="warn-msg">' +
        '<span>⚠ Já existe programação importada para '+esc(imp.prensa)+' · '+esc(imp.turno)+' em '+fmtDateBR(imp.data)+' ('+conflictCount+' registro(s)). O que fazer?</span>' +
        '<div class="segmented">' +
          '<button type="button" data-imp="importMode" data-value="complementar" class="'+((imp.importMode||"complementar")==="complementar"?"active":"")+'">Complementar</button>' +
          '<button type="button" data-imp="importMode" data-value="substituir" class="'+(imp.importMode==="substituir"?"active":"")+'">Substituir</button>' +
        '</div>' +
      '</div>';
    }

    body += (imp.error ? '<div class="error-msg">'+esc(imp.error)+'</div>' : '') +
      '<button class="btn btn-primary btn-block" data-action="confirm-import" '+((selCount===0||imp.busy)?"disabled":"")+'>'+
        (imp.busy?"Importando…":(conflictCount>0 && imp.importMode==="substituir" ? "Substituir e importar "+selCount+" ferramentas" : "Importar "+selCount+" ferramentas")) +
      '</button>';
  }

  return '' +
  '<div class="modal-overlay" data-action="close-modal">' +
    '<div class="modal" onclick="event.stopPropagation()">' +
      '<div class="modal-head"><h2>Importar planilha</h2><button class="modal-close" data-action="close-modal">×</button></div>' +
      body +
    '</div>' +
  '</div>';
}

/* ================= CORREÇÃO: staged edits ================= */
function findGroup(key){ return getCorrecaoGroups().find(function(g){return g.key===key;}); }
function toggleNecOk(key){
  var eff = effectiveNecStatus(key);
  var g = findGroup(key);
  var base = { codigo: g&&g.codigo, prensa: g&&g.prensa, data: g&&g.data, programacaoId: g&&g.programacaoId };
  if(eff.status==="OK"){
    state.necPending[key] = Object.assign({}, base, { status:"Pendente", previsaoLiberacao:null, observacaoCorrecao: eff.observacaoCorrecao||"" });
  } else {
    state.necPending[key] = Object.assign({}, base, { status:"OK", previsaoLiberacao:null, observacaoCorrecao: eff.observacaoCorrecao||"" });
  }
  render();
}
function setNecField(key, field, value){
  var eff = effectiveNecStatus(key);
  var g = findGroup(key);
  var draft = state.necPending[key] || { status:eff.status, previsaoLiberacao:eff.previsaoLiberacao, observacaoCorrecao:eff.observacaoCorrecao, codigo:g&&g.codigo, prensa:g&&g.prensa, data:g&&g.data, programacaoId:g&&g.programacaoId };
  draft[field] = value;
  state.necPending[key] = draft;
  render();
}
function markAllOk(){
  var groups = getCorrecaoGroups();
  if(!groups.length) return;
  var prensaLabel = state.correcaoPrensa==="Todas" ? "todas as prensas" : state.correcaoPrensa;
  if(!confirm("Marcar todas as "+groups.length+" ferramentas de "+prensaLabel+" como OK?")) return;
  groups.forEach(function(g){
    var eff = effectiveNecStatus(g.key);
    state.necPending[g.key] = { status:"OK", previsaoLiberacao:null, observacaoCorrecao: eff.observacaoCorrecao||"", codigo:g.codigo, prensa:g.prensa, data:g.data, programacaoId:g.programacaoId };
  });
  render();
}
// Escrita compartilhada de um status de necessidade (usada tanto pelo botão
// "Salvar" em lote quanto pelos botões de ação rápida — mesma lógica, sem
// duplicar). Retorna a Promise da gravação.
function saveNecStatusWrite(key, draft, now){
  var existing = state.statusByKey[key];
  var histEntry = {
    status: draft.status,
    previsaoLiberacao: draft.previsaoLiberacao||null,
    observacaoCorrecao: draft.observacaoCorrecao||"",
    usuario: { uid: state.user.uid, nome: state.user.nome },
    dataHora: now
  };
  var ref = state.db.doc("status/"+key);
  var base = {
    status: draft.status,
    previsaoLiberacao: draft.previsaoLiberacao||null,
    observacaoCorrecao: draft.observacaoCorrecao||"",
    atualizadoPor: { uid: state.user.uid, nome: state.user.nome },
    atualizadoEm: now
  };
  return withPermissionRetry(function(){
    if(existing){
      return ref.update(Object.assign({}, base, { historico: state.db.arrayUnion(histEntry) }));
    } else {
      var novo = { codigo: draft.codigo, prensa: draft.prensa, data: draft.data, historico: [histEntry] };
      if(draft.programacaoId) novo.programacaoId = draft.programacaoId;
      return ref.set(Object.assign({}, base, novo));
    }
  });
}
function savePendingChanges(){
  var keys = Object.keys(state.necPending);
  if(!keys.length || !state.db) return;
  var now = new Date().toISOString();
  var promises = keys.map(function(key){ return saveNecStatusWrite(key, state.necPending[key], now); });
  Promise.all(promises).then(function(){
    state.necPending = {};
    state.toast = keys.length+" atualização(ões) salva(s).";
    render();
  }).catch(function(err){ state.toast="Erro ao salvar: "+(err&&err.message||""); render(); });
}
// Confirmação antes de gravar — abre o modal comparando status atual x
// novo; a gravação em si só acontece em confirmQuickStatus/confirmBatchStatus,
// chamando exatamente as mesmas funções de sempre (quickSetStatus/
// savePendingChanges). Cancelar (ou fechar o modal) não altera nada.
function requestQuickStatusConfirm(key, statusValue){
  if(state.necBusy[key] || !state.db) return;
  var g = findGroup(key);
  if(!g) return;
  var eff = effectiveNecStatus(key);
  if(eff.status===statusValue) return; // já está nesse status; nada a confirmar
  state.confirmStatus = { kind:"quick", key:key, codigo:g.codigo, statusAtual:eff.status, statusNovo:statusValue };
  state.modal = "confirm-status";
  render();
}
function confirmQuickStatus(){

}
function requestBatchConfirm(){
  var keys = Object.keys(state.necPending);
  if(!keys.length || !state.db) return;
  var items = keys.map(function(key){
    var draft = state.necPending[key];
    var existing = state.statusByKey[key];
    var statusAtual = existing ? existing.status : "Pendente";
    return { key:key, codigo:draft.codigo, statusAtual:statusAtual, statusNovo:draft.status, statusChanged: statusAtual!==draft.status };
  });
  state.confirmStatus = { kind:"batch", items:items };
  state.modal = "confirm-status";
  render();
}
function confirmBatchStatus(){
  var c = state.confirmStatus;
  if(!c || c.kind!=="batch") return;
  state.modal = null; state.confirmStatus = null;
  savePendingChanges();
}
function quickSetStatus(key, statusValue){
  if(state.necBusy[key] || !state.db) return; // evita gravação duplicada em duplo toque
  var g = findGroup(key);
  if(!g) return;
  var eff = effectiveNecStatus(key);
  var draft = {
    status: statusValue,
    previsaoLiberacao: statusValue==="OK" ? null : (eff.previsaoLiberacao||null),
    observacaoCorrecao: eff.observacaoCorrecao||"",
    codigo: g.codigo, prensa: g.prensa, data: g.data, programacaoId: g.programacaoId
  };
  delete state.necPending[key]; // a ação rápida grava direto; não deixa uma edição em lote pendente e desatualizada
  state.necBusy[key] = true;
  render();
  var now = new Date().toISOString();
  return saveNecStatusWrite(key, draft, now).then(function(){
    state.necBusy[key] = false;
    state.toast = g.codigo+": "+statusValue+" salvo.";
    render();
  }).catch(function(err){
    state.necBusy[key] = false;
    state.toast = "Erro ao salvar "+g.codigo+": "+(err&&err.message||"");
    render();
  });
}
// Atalho +1/+2/+3 dias: grava imediatamente só a previsão, reaproveitando
// exatamente a mesma lógica de previsão (addDaysStr) e o mesmo caminho de
// gravação (saveNecStatusWrite) — status e observação atuais são mantidos.
function quickSetPrevisao(key, days){
  if(state.necBusy[key] || !state.db) return;
  var g = findGroup(key);
  if(!g) return;
  var eff = effectiveNecStatus(key);
  var draft = {
    status: eff.status,
    previsaoLiberacao: addDaysStr(days),
    observacaoCorrecao: eff.observacaoCorrecao||"",
    codigo: g.codigo, prensa: g.prensa, data: g.data, programacaoId: g.programacaoId
  };
  delete state.necPending[key];
  state.necBusy[key] = true;
  render();
  var now = new Date().toISOString();
  return saveNecStatusWrite(key, draft, now).then(function(){
    state.necBusy[key] = false;
