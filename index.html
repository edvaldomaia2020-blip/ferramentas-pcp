// "Ciente" — a Correção só confirma que VIU a urgência. Não toca em status,
// previsão nem observação (grava só nos 3 campos que a regra do Firestore
// permite à Correção: reconhecida/reconhecidaEm/reconhecidaPor).
function reconhecerUrgencia(key, codigo){
  if(state.necBusy["urg_"+key] || !state.db) return;
  state.necBusy["urg_"+key] = true;
  render();
  return withPermissionRetry(function(){
    return state.db.doc("urgencias/"+key).update({
      reconhecida: true,
      reconhecidaEm: state.db.serverTimestamp(),
      reconhecidaPor: { uid: state.user.uid, nome: state.user.nome }
    });
  }).then(function(){
    state.necBusy["urg_"+key] = false;
    state.toast = codigo+": urgência marcada como ciente.";
    render();
  }).catch(function(err){
    state.necBusy["urg_"+key] = false;
    state.toast = "Erro ao registrar ciência: "+(err&&err.message||"");
    render();
  });
}

/* ================= WRITES (PCP) ================= */
/* Retry once, after a short pause, if Firestore momentarily denies a write
   right after a login/account switch (token propagation race) — never
   retries a write that is genuinely not permitted. */
function withPermissionRetry(fn){
  return fn().catch(function(err){
    if(err && err.code==="permission-denied"){
      return new Promise(function(resolve){ setTimeout(resolve, 700); }).then(fn);
    }
    throw err;
  });
}
function upsertNecessidadeDelta(t, sign){
  if(!state.db) return Promise.resolve();
  var key = necDocId(t.codigo, t.prensa, t.dataProgramacao, t.programacaoId);
  var kg = (t.quantidadeKg||0) * sign;
  var body = {
    codigo: t.codigo, prensa: t.prensa, data: t.dataProgramacao,
    kgTotal: state.db.increment(kg),
    count: state.db.increment(sign)
  };
  if(t.programacaoId) body.programacaoId = t.programacaoId;
  if(t.tipo==="Reserva") body.kgReserva = state.db.increment(kg); else body.kgProgramacao = state.db.increment(kg);
  if(sign>0 && t.observacaoPCP) body.observacoes = state.db.arrayUnion(t.observacaoPCP);
  // Cliente(s) — mesma técnica já usada para observacoes (arrayUnion, só
  // ao somar), para permitir a busca por cliente na Correção sem precisar
  // ler os registros brutos (que a Correção nem tem acesso).
  if(sign>0 && t.cliente) body.clientes = state.db.arrayUnion(t.cliente);
  return state.db.doc("necessidades/"+key).set(body, {merge:true});
}

function submitNewTool(){
  var codigo = document.getElementById("nt-codigo").value.trim().toUpperCase();
  var kg = parseFloat(document.getElementById("nt-kg").value);
  var data = document.getElementById("nt-data").value || todayStr();
  var obs = document.getElementById("nt-obs").value.trim();
  var cliente = document.getElementById("nt-cliente").value.trim();
  var corte = document.getElementById("nt-corte").value.trim();
  var liga = document.getElementById("nt-liga").value.trim();
  state.newTool.codigo = codigo; state.newTool.kg = document.getElementById("nt-kg").value; state.newTool.obs = obs; state.newTool.data = data;
  state.newTool.cliente = cliente; state.newTool.corte = corte; state.newTool.liga = liga;
  if(!codigo || isNaN(kg) || kg<0){ state.authError="Informe código e quantidade válidos."; render(); return; }
  if(!state.db){ return; }
  var doc = {
    codigo: codigo,
    cliente: cliente,
    quantidadeKg: kg,
    corte: corte,
    liga: liga,
    tipo: state.newTool.tipo || "Programação",
    prensa: state.newTool.prensa,
    turno: state.newTool.turno,
    dataProgramacao: data,
    observacaoPCP: obs,
    solicitadoPor: { uid: state.user.uid, nome: state.user.nome },
    criadoEm: new Date().toISOString()
  };
  withPermissionRetry(function(){
    return state.db.collection("ferramentas").add(doc).then(function(){
      return upsertNecessidadeDelta(doc, 1);
    });
  }).then(function(){
    state.modal=null; state.toast="Ferramenta enviada para a Correção."; render();
  }).catch(function(err){ state.authError="Erro ao salvar: "+(err&&err.message||""); render(); });
}

function deleteTool(id){
  if(!state.db) return;
  var t = state.ferramentas.find(function(x){return x.id===id;});
  withPermissionRetry(function(){
    return state.db.doc("ferramentas/"+id).delete().then(function(){
      if(t) return upsertNecessidadeDelta(t, -1);
    });
  }).then(function(){ state.toast="Solicitação excluída."; render(); })
    .catch(function(err){ state.toast="Erro ao excluir: "+(err&&err.message||""); render(); });
}

/* ================= URGÊNCIA (PCP -> Correção) =================
   Camada independente do status/kg/previsão — nunca sobrescreve nem
   substitui nada disso. Usa a MESMA chave de consolidação já usada por
   necessidades/status (código+prensa+data), numa coleção própria
   ("urgencias"), para não misturar com o histórico de status que é
   escrito exclusivamente pela Correção. */
function marcarUrgente(codigo, prensa, data, programacaoId){
  var key = necDocId(codigo, prensa, data, programacaoId);
  if(!confirm("Marcar "+codigo+" como URGENTE para a Correção?")) return;
  if(!state.db) return;
  var body = {
    codigo: codigo, prensa: prensa, data: data,
    urgente: true,
    criadoEm: state.db.serverTimestamp(),
    criadoPor: { uid: state.user.uid, nome: state.user.nome },
    reconhecida: false, reconhecidaEm: null, reconhecidaPor: null,
    encerradaEm: null, encerradaPor: null
  };
  if(programacaoId) body.programacaoId = programacaoId;
  return withPermissionRetry(function(){
    return state.db.doc("urgencias/"+key).set(body);
  }).then(function(){ state.toast = codigo+": marcado como URGENTE para a Correção."; render(); })
    .catch(function(err){ state.toast = "Erro ao marcar urgência: "+(err&&err.message||""); render(); });
}
// Botão único do PCP (card): decide ativar ou retirar a urgência conforme
// o estado atual — sem duplicar lógica, delega inteiramente para
// marcarUrgente/encerrarUrgencia (as mesmas funções de sempre, cada uma
// com sua própria confirmação).
function toggleUrgencia(key, codigo, prensa, data, programacaoId){
  var urg = state.urgenciasByKey[key];
  if(urg && urg.urgente){
    encerrarUrgencia(key, codigo);
  } else {
    marcarUrgente(codigo, prensa, data, programacaoId);
  }
}
function encerrarUrgencia(key, codigo){
  if(!confirm('Deseja retirar a urgência de '+codigo+'?')) return;
  if(!state.db) return;
  return withPermissionRetry(function(){
    return state.db.doc("urgencias/"+key).update({
      urgente: false,
      encerradaEm: state.db.serverTimestamp(),
      encerradaPor: { uid: state.user.uid, nome: state.user.nome }
    });
  }).then(function(){ state.toast = "Urgência de "+codigo+" encerrada."; render(); })
    .catch(function(err){ state.toast = "Erro ao encerrar urgência: "+(err&&err.message||""); render(); });
}

/* ================= IMPORT FROM SPREADSHEET ================= */
function ensureXLSX(cb){
  if(window.XLSX){ cb(); return; }
  var s = document.createElement("script");
  s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
  s.onload = cb;
  s.onerror = function(){ state.import.loading=false; state.import.error="Não foi possível carregar o leitor de planilhas (verifique a conexão)."; render(); };
  document.head.appendChild(s);
}
function sheetToGrid(sheet){
  return XLSX.utils.sheet_to_json(sheet, {header:1, defval:"", raw:false});
}
function handleImportFile(file){
  state.import.loading = true; state.import.error=""; render();
  ensureXLSX(function(){
    var reader = new FileReader();
    reader.onload = function(e){
      try{
        var data = new Uint8Array(e.target.result);
        var wb = XLSX.read(data, {type:"array"});
        initImportFromWorkbook(wb);
      }catch(err){
        state.import.loading=false; state.import.error="Erro ao ler arquivo: "+(err&&err.message||""); render();
      }
    };
    reader.onerror = function(){ state.import.loading=false; state.import.error="Erro ao ler arquivo."; render(); };
    reader.readAsArrayBuffer(file);
  });
}
function initImportFromWorkbook(wb){
  var names = wb.SheetNames;
  var chosen = names[0];
  for(var i=0;i<names.length;i++){
    var g = sheetToGrid(wb.Sheets[names[i]]);
    var found = g.some(function(row){ return row.some(function(c){ return normalizeHeader(c).indexOf("FERRAMENTA")>=0; }); });
    if(found){ chosen = names[i]; break; }
  }
  state.import.loading = false;
  state.import.workbook = wb;
  state.import.sheetNames = names;
  loadImportSheet(chosen);
}
function loadImportSheet(name){
  var grid = sheetToGrid(state.import.workbook.Sheets[name]);
  state.import.sheetName = name;
  state.import.grid = grid;
  state.import.headerRowIndex = autoDetectHeaderRow(grid);
  state.import.colMap = autoColMap(grid, state.import.headerRowIndex);
  state.import.rowChecked = {};
  state.import.rowTipoOverride = {};
  render();
}
function buildImportDocs(){
  var imp = state.import;
  if(!imp || !imp.grid) return [];
  var rows = classifyRows(imp.grid, imp.headerRowIndex);
  var toCreate = rows.filter(function(r){ return r.kind==="data" && imp.rowChecked[r.index]!==false; });
  var now = new Date().toISOString();
  return toCreate.map(function(r){
    function cell(field){ var idx=imp.colMap[field]; return idx===undefined? "" : (r.cells[idx]||"").toString().trim(); }
    var tipo = imp.rowTipoOverride[r.index] || r.tipo;
    return {
      codigo: cell("codigo").toUpperCase(),
      cliente: cell("cliente"),
      quantidadeKg: parseKg(cell("quantidadeKg")),
      corte: cell("corte"),
      liga: cell("liga"),
      tipo: tipo,
      prensa: imp.prensa,
      turno: imp.turno,
      dataProgramacao: imp.data,
      observacaoPCP: cell("observacaoPCP"),
      solicitadoPor: { uid: state.user.uid, nome: state.user.nome },
      criadoEm: now
    };
  }).filter(function(d){ return d.codigo; });
}
function doConfirmImport(){
  var imp = state.import;
  if(imp.colMap.codigo===undefined || imp.colMap.quantidadeKg===undefined){ imp.error="Selecione as colunas de Código e Quantidade (kg)."; render(); return; }
  var docs = buildImportDocs();
  if(!docs.length){ imp.error="Nenhuma linha selecionada."; render(); return; }
  if(!state.db) return;
  imp.busy = true; imp.error=""; render();
  var proceed = function(){
    Promise.all(docs.map(function(d){
      return withPermissionRetry(function(){ return state.db.collection("ferramentas").add(d).then(function(){ return upsertNecessidadeDelta(d, 1); }); });
    })).then(function(){
      imp.busy=false; state.modal=null; state.import=null; state.toast=docs.length+" ferramentas importadas."; render();
    }).catch(function(err){ imp.busy=false; imp.error="Erro ao importar: "+(err&&err.message||""); render(); });
  };
  if(imp.importMode==="substituir"){
    var toDelete = state.ferramentas.filter(function(t){return t.prensa===imp.prensa && t.turno===imp.turno && t.dataProgramacao===imp.data;});
    Promise.all(toDelete.map(function(t){
      return withPermissionRetry(function(){ return state.db.doc("ferramentas/"+t.id).delete().then(function(){ return upsertNecessidadeDelta(t, -1); }); });
    })).then(proceed).catch(function(err){
      imp.busy=false; imp.error="Erro ao substituir: "+(err&&err.message||""); render();
    });
  } else {
    proceed();
  }
}

/* ================= ESPELHO SYNC (4.ESPELHO) =================
   Importador dedicado para a aba "4.ESPELHO" da Master do PCP. Completamente
   separado do importador genérico acima (que continua funcionando como
   antes, para qualquer outra planilha/aba). Lê só os valores já calculados
   do Excel (nunca tenta recalcular fórmulas), monta uma prévia classificada
   (NOVA / RESERVA→PRINCIPAL / ALTERADA / RETIRADA / SEM ALTERAÇÃO) e só
   grava no Firestore depois de o PCP confirmar explicitamente. */

// Doc reservado dentro de "necessidades" (mesma coleção, sem precisar de
// nenhuma regra nova) guardando só o resumo da última sincronização do
// Espelho — id garantidamente diferente de qualquer necDocId real (que
// nunca começa com "__"). Lido pela Correção em tempo real via a mesma
// assinatura que já existe; filtrado antes de virar uma linha da lista.
var SYNC_META_DOC_ID = "__sync_meta__";
var ESP_PRINCIPAL_RE = /^Programa[cç][aã]o\s+(P\d+)\s*[—-]+\s*(\d{2}\/\d{2}\/\d{4})\s*[—-]+\s*Turno:\s*(DIA|NOITE)/i;
var ESP_RESERVA_RE = /^PROGRAMA[CÇ][AÃ]O\s+RESERVA.*turno\s+seguinte\s*\((DIA|NOITE)\)/i;
var ESP_TOTAL_RE = /^TOTAL\b/i;

function espBrDateToIso(dd_mm_yyyy){
  var m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(dd_mm_yyyy);
  return m ? (m[3]+"-"+m[2]+"-"+m[1]) : null;
}
function mapEspelhoCols(headerRowCells){
  var map = {};
  headerRowCells.forEach(function(cell, idx){
    var h = normalizeHeader(cell);
    if(map.codigo===undefined && /FERRAMENTA/.test(h)) map.codigo = idx;
    else if(map.cliente===undefined && /CLIENTE/.test(h)) map.cliente = idx;
    else if(map.quantidadeKg===undefined && /QUANT/.test(h)) map.quantidadeKg = idx;
    else if(map.corte===undefined && /CORTE/.test(h)) map.corte = idx;
    else if(map.liga===undefined && /^LIGA/.test(h)) map.liga = idx;
    else if(map.barras===undefined && /BARRA/.test(h)) map.barras = idx;
    else if(map.observacaoPCP===undefined && /OBSERV/.test(h)) map.observacaoPCP = idx;
  });
  return map;
}
// Célula "QUANT. (KG)" vem formatada pelo XLSX.js como texto (ex: "1,445 KG").
// Verificado contra os valores calculados reais do arquivo: "," aqui é
// separador de milhar (não decimal) — kg nesta planilha é sempre inteiro.
function parseKgEspelho(raw){
  var s = (raw==null?"":raw).toString().replace(/[^\d.,\-]/g,"");
  s = s.replace(/,/g, "");
  var n = parseFloat(s);
  return isNaN(n) ? null : n;
}
function espReadSection(grid, titleRow, titleCol){
  var warnings = [];
  var headerRowIdx = titleRow + 1;
  var headerCells = grid[headerRowIdx] ? grid[headerRowIdx].slice(titleCol, titleCol+7) : [];
  var colMap = mapEspelhoCols(headerCells);
  if(colMap.codigo===undefined || colMap.quantidadeKg===undefined){
    warnings.push("Linha "+(headerRowIdx+1)+": não encontrei as colunas FERRAMENTA/QUANT.(KG) esperadas — seção ignorada.");
    return { rows: [], warnings: warnings };
  }
  var rows = [];
  for(var r = headerRowIdx + 1; r < grid.length; r++){
    var firstCell = (grid[r][titleCol] || "").toString().trim();
    if(ESP_TOTAL_RE.test(firstCell)) break;
    if(ESP_PRINCIPAL_RE.test(firstCell) || ESP_RESERVA_RE.test(firstCell)) break;
    function cell(field){
      var idx = colMap[field];
      if(idx===undefined) return "";
      var v = grid[r][titleCol+idx];
      return v==null ? "" : v.toString().trim();
    }
    var codigo = cell("codigo");
    if(!codigo) continue;
    var kg = parseKgEspelho(cell("quantidadeKg"));
    if(kg===null){
      warnings.push("Linha "+(r+1)+": ferramenta \""+codigo+"\" sem quantidade (kg) válida — registro não incluído.");
      continue;
    }
    rows.push({ codigo: codigo.toUpperCase(), cliente: cell("cliente"), quantidadeKg: kg, corte: cell("corte"), liga: cell("liga"), barras: cell("barras"), observacaoPCP: cell("observacaoPCP") });
  }
  return { rows: rows, warnings: warnings };
}
function espScanColumn(grid, titleCol){
  var buckets = [], ignoredReservaNoite = [], warnings = [];
  var currentDate = null, currentPrensa = null;
  for(var r = 0; r < grid.length; r++){
    var cellVal = (grid[r][titleCol] || "").toString().trim();
    if(!cellVal) continue;
    var mP = ESP_PRINCIPAL_RE.exec(cellVal);
    var mR = !mP ? ESP_RESERVA_RE.exec(cellVal) : null;
    if(mP){
      var prensa = mP[1].toUpperCase();
      var dataIso = espBrDateToIso(mP[2]);
      var turno = mP[3].toUpperCase()==="DIA" ? "Dia" : "Noite";
      currentDate = dataIso; currentPrensa = prensa;
      if(!dataIso){ warnings.push("Linha "+(r+1)+": não consegui interpretar a data do título \""+cellVal+"\"."); continue; }
      var sec = espReadSection(grid, r, titleCol);
      buckets.push({ prensa:prensa, turno:turno, tipo:"Programação", turnoOrigem:null, data:dataIso, rows:sec.rows });
      warnings.push.apply(warnings, sec.warnings);
    } else if(mR){
      var turnoAlvo = mR[1].toUpperCase()==="DIA" ? "Dia" : "Noite";
      if(!currentDate || !currentPrensa){
        warnings.push("Linha "+(r+1)+": bloco de reserva sem programação principal antes — ignorado.");
        continue;
      }
      var sec2 = espReadSection(grid, r, titleCol);
      if(turnoAlvo === "Noite"){
        buckets.push({ prensa:currentPrensa, turno:"Noite", tipo:"Reserva", turnoOrigem:"Dia", data:currentDate, rows:sec2.rows });
        warnings.push.apply(warnings, sec2.warnings);
      } else {
        ignoredReservaNoite.push({ prensa:currentPrensa, data:currentDate, count:sec2.rows.length });
      }
    }
  }
  return { buckets:buckets, ignoredReservaNoite:ignoredReservaNoite, warnings:warnings };
}
// Lê o valor BRUTO da célula (não o texto formatado tipo "12-Sep", que
// esconde ano e hora). Se for uma data reconhecível pelo Excel, devolve
// ano/mês/dia/hora/minuto exatos via XLSX.SSF (sem passar por Date/fuso
// horário). Se não for uma data reconhecível, devolve o texto como está,
// sem inventar nada.
function espColLetter(idx){
  var s = ""; idx++;
  while(idx>0){ var m=(idx-1)%26; s=String.fromCharCode(65+m)+s; idx=Math.floor((idx-1)/26); }
  return s;
}
function espReadEmitidoEmCell(sheet, rowIdx, colIdx){
  var addr = espColLetter(colIdx) + (rowIdx+1);
  var cell = sheet[addr];
  if(!cell) return { iso:null, hasTime:false };
  if(cell.t === "n" && typeof cell.v === "number" && window.XLSX && XLSX.SSF && XLSX.SSF.parse_date_code){
    var d = XLSX.SSF.parse_date_code(cell.v);
    if(d && d.y > 1900 && d.y < 2200){
      var pad2 = function(n){ return ("0"+Math.floor(n)).slice(-2); };
      var hasTime = Math.round((d.H||0)*3600+(d.M||0)*60+(d.S||0)) !== 0;
      return {
        iso: d.y+"-"+pad2(d.m)+"-"+pad2(d.d)+"T"+pad2(d.H||0)+":"+pad2(d.M||0)+":"+pad2(d.S||0),
        hasTime: hasTime, y:d.y, mo:d.m, da:d.d, H:d.H||0, Mi:d.M||0
      };
    }
  }
  var raw = cell.w!=null ? cell.w.toString() : (cell.v!=null ? cell.v.toString() : "");
  return raw ? { iso: raw, hasTime:false, isRawText:true } : { iso:null, hasTime:false };
}
function fmtEmitidoEmBR(meta){
  if(!meta || !meta.iso) return "não identificado";
  if(meta.isRawText) return meta.iso;
  var pad2 = function(n){ return ("0"+n).slice(-2); };
  var dataBR = pad2(meta.da)+"/"+pad2(meta.mo)+"/"+meta.y;
  return meta.hasTime ? (dataBR+" "+pad2(meta.H)+":"+pad2(meta.Mi)) : dataBR;
}
function parseEspelhoSheet(grid, sheet){
  var emitidoEm = null, emitidoEmMeta = null;
  for(var r=0; r<Math.min(grid.length,10); r++){
    if(normalizeHeader(grid[r][0]) === "EMITIDO EM"){
      emitidoEmMeta = espReadEmitidoEmCell(sheet, r, 1);
      emitidoEm = emitidoEmMeta.iso;
      break;
    }
  }
  var p7 = espScanColumn(grid, 0);
  var p4 = espScanColumn(grid, 8);
  return {
    emitidoEm: emitidoEm,
    emitidoEmMeta: emitidoEmMeta,
    buckets: p7.buckets.concat(p4.buckets),
    ignoredReservaNoite: p7.ignoredReservaNoite.concat(p4.ignoredReservaNoite),
    warnings: p7.warnings.concat(p4.warnings)
  };
}
function espSignature(row){
  return (row.codigo||"")+"|"+(row.cliente||"")+"|"+(row.quantidadeKg==null?"":row.quantidadeKg)+"|"+(row.corte||"");
}
function espReconcileBucket(bucket, existingDocs, claimedIds){
  var items = [];
  function scoped(pred){
    return existingDocs.filter(function(d){ return d.prensa===bucket.prensa && d.dataProgramacao===bucket.data && !claimedIds.has(d.id) && pred(d); });
  }
  var poolPromotion = (bucket.tipo==="Programação" && bucket.turno==="Noite")
    ? scoped(function(d){ return d.tipo==="Reserva" && d.turnoOrigem==="Dia" && d.turno==="Noite"; }) : [];
  var poolSameBucket = scoped(function(d){
    if(bucket.tipo==="Reserva") return d.tipo==="Reserva" && d.turnoOrigem==="Dia" && d.turno==="Noite";
    return d.tipo==="Programação" && d.turno===bucket.turno && !d.turnoOrigem;
  });
  function bySignature(pool){ var m={}; pool.forEach(function(d){ var s=espSignature(d); (m[s]=m[s]||[]).push(d); }); return m; }
  var promoIdx = bySignature(poolPromotion), sameIdx = bySignature(poolSameBucket);
  var unmatchedNew = [];
  bucket.rows.forEach(function(newRow){
    var sig = espSignature(newRow);
    if(promoIdx[sig] && promoIdx[sig].length){
      var oldP = promoIdx[sig].shift(); claimedIds.add(oldP.id);
      items.push({ type:"PROMOVIDA", newRow:newRow, oldDoc:oldP, prensa:bucket.prensa, data:bucket.data, turno:bucket.turno, tipo:bucket.tipo }); return;
    }
    if(sameIdx[sig] && sameIdx[sig].length){
      var oldS = sameIdx[sig].shift(); claimedIds.add(oldS.id);
      items.push({ type:"SEM_ALTERACAO", newRow:newRow, oldDoc:oldS, prensa:bucket.prensa, data:bucket.data, turno:bucket.turno, tipo:bucket.tipo }); return;
    }
    unmatchedNew.push(newRow);
  });
  var leftoverOld = poolSameBucket.filter(function(d){ return !claimedIds.has(d.id); });
  unmatchedNew.forEach(function(newRow){
    var idx = leftoverOld.findIndex(function(d){ return d.codigo===newRow.codigo && !claimedIds.has(d.id); });
    if(idx>=0){
      var oldA = leftoverOld[idx]; claimedIds.add(oldA.id); leftoverOld.splice(idx,1);
      items.push({ type:"ALTERADA", newRow:newRow, oldDoc:oldA, prensa:bucket.prensa, data:bucket.data, turno:bucket.turno, tipo:bucket.tipo });
    } else {
      items.push({ type:"NOVA", newRow:newRow, oldDoc:null, prensa:bucket.prensa, data:bucket.data, turno:bucket.turno, tipo:bucket.tipo });
    }
  });
  leftoverOld.forEach(function(d){
    if(claimedIds.has(d.id)) return;
    items.push({ type:"RETIRADA", newRow:null, oldDoc:d, prensa:bucket.prensa, data:bucket.data, turno:d.turno, tipo:d.tipo });
    claimedIds.add(d.id);
  });
  return items;
}
function espReconcile(buckets, existingDocs){
  var claimedIds = new Set();
  var allItems = [];
  var ordered = buckets.slice().sort(function(a,b){
    function rank(x){ if(x.tipo==="Programação" && x.turno==="Noite") return 0; if(x.tipo==="Programação") return 1; return 2; }
    return rank(a)-rank(b);
  });
  ordered.forEach(function(bucket){ allItems = allItems.concat(espReconcileBucket(bucket, existingDocs, claimedIds)); });
  var summary = { NOVA:0, PROMOVIDA:0, ALTERADA:0, RETIRADA:0, SEM_ALTERACAO:0 };
  allItems.forEach(function(it){ summary[it.type]++; });
  return { items: allItems, summary: summary };
}

function handleEspelhoFile(file){
  var es = state.espelhoSync;
  es.loading = true; es.error=""; render();
  ensureXLSX(function(){
    var reader = new FileReader();
    reader.onload = function(e){
      try{
        var data = new Uint8Array(e.target.result);
        var wb = XLSX.read(data, {type:"array"});
        if(wb.SheetNames.indexOf("4.ESPELHO") === -1){
          es.loading=false; es.error="Não foi encontrada a aba 4.ESPELHO."; render(); return;
        }
        var espSheet = wb.Sheets["4.ESPELHO"];
        var grid = sheetToGrid(espSheet);
        var parsed = parseEspelhoSheet(grid, espSheet);
        var reconcile = espReconcile(parsed.buckets, state.ferramentas);
        var dup = !!(parsed.emitidoEm && state.ferramentas.some(function(t){ return t.origemEspelho && t.origemEspelho===parsed.emitidoEm; }));
        es.loading=false; es.step="preview"; es.parsed=parsed; es.reconcile=reconcile; es.duplicateWarning=dup;
        render();
      }catch(err){
        es.loading=false; es.error="Erro ao ler arquivo: "+(err&&err.message||""); render();
      }
    };
    reader.onerror = function(){ es.loading=false; es.error="Erro ao ler arquivo."; render(); };
    reader.readAsArrayBuffer(file);
  });
}

function doConfirmEspelhoSync(){
  var es = state.espelhoSync;
  if(!es || !es.reconcile || !state.db) return;
  es.busy = true; es.error=""; render();
  var now = new Date().toISOString();
  var emitidoEm = es.parsed.emitidoEm;
  var counts = { novas:0, promovidas:0, alteradas:0, mantidas:0, retiradas:0, erros:0, errosDetalhe:[] };

  function buildNewDoc(row, item){
    return {
      codigo: row.codigo, cliente: row.cliente, quantidadeKg: row.quantidadeKg, corte: row.corte,
      liga: row.liga, barras: row.barras||"", tipo: item.tipo, prensa: item.prensa, turno: item.turno,
      turnoOrigem: (item.tipo==="Reserva" ? "Dia" : (item.oldDoc && item.oldDoc.turnoOrigem==="Dia" ? "Dia" : null)),
      dataProgramacao: item.data, observacaoPCP: row.observacaoPCP||"",
      solicitadoPor: { uid: state.user.uid, nome: state.user.nome },
      criadoEm: now, origemEspelho: emitidoEm
    };
  }

  var ops = es.reconcile.items.map(function(item){
    if(item.type==="NOVA"){
      var doc = buildNewDoc(item.newRow, item);
      return withPermissionRetry(function(){
        return state.db.collection("ferramentas").add(doc).then(function(){ return upsertNecessidadeDelta(doc, 1); });
      }).then(function(){ counts.novas++; }).catch(function(err){ counts.erros++; counts.errosDetalhe.push("Nova "+item.newRow.codigo+": "+(err&&err.message||"")); });
    }
    if(item.type==="PROMOVIDA" || item.type==="ALTERADA"){
      var newDoc = buildNewDoc(item.newRow, item);
      return withPermissionRetry(function(){
        return state.db.doc("ferramentas/"+item.oldDoc.id).delete()
          .then(function(){ return upsertNecessidadeDelta(item.oldDoc, -1); })
          .then(function(){ return state.db.collection("ferramentas").add(newDoc); })
          .then(function(){ return upsertNecessidadeDelta(newDoc, 1); });
      }).then(function(){ if(item.type==="PROMOVIDA") counts.promovidas++; else counts.alteradas++; })
        .catch(function(err){ counts.erros++; counts.errosDetalhe.push(item.type+" "+item.oldDoc.codigo+": "+(err&&err.message||"")); });
    }
    if(item.type==="SEM_ALTERACAO"){ counts.mantidas++; return Promise.resolve(); }
    if(item.type==="RETIRADA"){
      // O registro bruto em "ferramentas" NUNCA é excluído automaticamente
      // (mantido para auditoria/histórico do PCP) — mas seu kg PRECISA sair
      // da necessidade consolidada, senão o total da Correção fica inflado
      // para sempre a cada linha que sai do Espelho (causa raiz de
      // necessidades com kg "sobrando" depois de reimportações).
      return withPermissionRetry(function(){ return upsertNecessidadeDelta(item.oldDoc, -1); })
        .then(function(){ counts.retiradas++; })
        .catch(function(err){ counts.erros++; counts.errosDetalhe.push("Retirada "+item.oldDoc.codigo+": "+(err&&err.message||"")); });
    }
    return Promise.resolve();
  });

  Promise.all(ops).then(function(){
    es.busy=false; es.step="done";
    es.done = { novas:counts.novas, promovidas:counts.promovidas, alteradas:counts.alteradas, mantidas:counts.mantidas, retiradas:counts.retiradas, erros:counts.erros, errosDetalhe:counts.errosDetalhe, horario:now };
    var registrosOk = counts.novas + counts.promovidas + counts.alteradas + counts.mantidas;
    // "Programação atualizada em" (exibida na Correção) só avança quando a
    // sincronização termina TOTALMENTE sem erros — se qualquer item falhou,
    // o horário mostrado para a Correção continua sendo o da última
    // sincronização que de fato deu certo por completo. Usa o horário do
    // SERVIDOR do Firestore (serverTimestamp), não o relógio do aparelho,
    // para nunca mostrar um horário errado por causa de um relógio
    // desacertado. emitidoEm (marcador interno da própria planilha) é
    // gravado à parte, só para referência — nunca é o que é exibido como
    // "atualizada em".
    if(counts.erros===0){
      withPermissionRetry(function(){
        return state.db.doc("necessidades/"+SYNC_META_DOC_ID).set({
          __meta__: true, emitidoEm: emitidoEm, registros: registrosOk, erros: 0,
          ultimaAtualizacaoProgramacao: state.db.serverTimestamp(),
          atualizadoPor: { uid: state.user.uid, nome: state.user.nome },
          origem: "espelho"
        });
      }).catch(function(){ /* indicador de "última sincronização" é informativo; nunca bloqueia a conclusão do sync */ }).then(function(){
        render();
      });
    } else {
      render();
    }
  });
}

/* ================= BASE_APP IMPORT (Etapa 3) =================
   Único caminho de importação de "programação" a partir desta etapa.
   Lê EXCLUSIVAMENTE a aba BASE_APP (contrato normalizado gerado pelo
   VBA) — nunca abas datadas, nunca PROG. DO DIA/NOITE/FUTURA, nunca
   TOTAL/RESERVA por layout, nunca células mescladas, nunca o cabeçalho
   "Programação P7"...". Toda essa complexidade agora é responsabilidade
   exclusiva do Excel/VBA. Se a aba BASE_APP não existir, a importação é
   BLOQUEADA com mensagem clara — não há fallback para o importador
   genérico nem para o sincronizador do Espelho (que continuam existindo,
   intocados, para outros usos). */
var BASE_APP_SHEET_NAME = "BASE_APP";
var BASE_APP_REQUIRED_COLS = ["POSICAO_PROGRAMACAO","ORIGEM","DATA_PROGRAMACAO","TURNO","PRENSA","FERRAMENTA","CLIENTE","QUANTIDADE_KG","CORTE","LIGA","OBSERVACAO","ORDEM_ORIGEM","CHAVE_ORIGEM","SECAO"];
var BASE_APP_POSICOES = ["ATUAL","PROXIMA","FUTURA"];
var BASE_APP_PAPEL_MAP = { ATUAL:"atual", PROXIMA:"proxima", FUTURA:"futura" };

function baseAppFindHeaderRow(grid){
  for(var i=0;i<Math.min(grid.length,40);i++){
    if(grid[i] && normalizeHeader(grid[i][0])==="POSICAO_PROGRAMACAO") return i;
  }
  return -1;
}
function baseAppColMap(grid, headerRowIndex){
  var header = grid[headerRowIndex]||[];
  var map = {};
  header.forEach(function(cell, idx){
    var h = normalizeHeader(cell).replace(/\s+/g,"_");
    BASE_APP_REQUIRED_COLS.forEach(function(name){ if(h===name) map[name]=idx; });
  });
  return map;
}
// Lê a célula BRUTA (não o texto formatado) para nunca perder ano/hora
// nem depender de locale — mesmo padrão já usado e testado para o
// "EMITIDO EM" do Espelho (espReadEmitidoEmCell).
function baseAppReadDateCell(sheet, rowIdx, colIdx){
  var addr = espColLetter(colIdx) + (rowIdx+1);
  var cell = sheet[addr];
  if(cell && cell.t==="n" && typeof cell.v==="number" && window.XLSX && XLSX.SSF && XLSX.SSF.parse_date_code){
    var d = XLSX.SSF.parse_date_code(cell.v);
    if(d && d.y>1900 && d.y<2200){
      var pad2 = function(n){ return ("0"+Math.floor(n)).slice(-2); };
      return d.y+"-"+pad2(d.m)+"-"+pad2(d.d);
    }
  }
  return null;
}
function baseAppReadNumCell(sheet, rowIdx, colIdx){
  var addr = espColLetter(colIdx) + (rowIdx+1);
  var cell = sheet[addr];
  if(cell && cell.t==="n" && typeof cell.v==="number") return cell.v;
  if(cell && cell.v!=null && cell.v!==""){ var n=parseFloat(cell.v); if(!isNaN(n)) return n; }
  return null;
}
// BASE_APP entrega TURNO como "DIA"/"NOITE" (maiúsculo); o resto do app
// usa "Dia"/"Noite" em toda parte (filtros, renderCard, necDocId indireto
// via t.turno). Normaliza aqui, uma única vez, para nunca vazar o valor
// bruto do Excel para dentro do app.
function normTurnoBaseApp(v){
  var t = normalizeHeader(v);
  if(t==="DIA") return "Dia";
  if(t==="NOITE") return "Noite";
  return (v||"").toString().trim();
}
function parseBaseAppSheet(wb){
  var sheetName = (wb.SheetNames||[]).filter(function(n){ return n===BASE_APP_SHEET_NAME; })[0];
  if(!sheetName){
    return { error: 'Importação não realizada. A aba "BASE_APP" não foi encontrada neste arquivo — este importador só aceita a BASE_APP gerada pelo Excel/VBA. Verifique se enviou o arquivo certo.' };
  }
  var sheet = wb.Sheets[sheetName];
  var grid = sheetToGrid(sheet);
  var headerRowIndex = baseAppFindHeaderRow(grid);
  if(headerRowIndex===-1){
    return { error: 'Importação não realizada. Cabeçalho da BASE_APP não encontrado (coluna "POSICAO_PROGRAMACAO" ausente). A aba existe, mas não está no formato esperado.' };
  }
  var colMap = baseAppColMap(grid, headerRowIndex);
  var missing = BASE_APP_REQUIRED_COLS.filter(function(c){ return colMap[c]===undefined; });
  if(missing.length){
    return { error: 'Importação não realizada. Coluna(s) não encontrada(s) na BASE_APP: ' + missing.join(", ") + "." };
  }
  var records = [];
  for(var r=headerRowIndex+1; r<grid.length; r++){
    var row = grid[r];
    if(!row) continue;
    var cell = function(name){ var idx=colMap[name]; return idx===undefined? "" : (row[idx]==null? "" : row[idx].toString()); };
    var posicao = cell("POSICAO_PROGRAMACAO").trim().toUpperCase();
    var ferramenta = cell("FERRAMENTA").trim();
    var origem = cell("ORIGEM").trim();
    var chaveOrigem = cell("CHAVE_ORIGEM").trim();
    if(!posicao && !ferramenta && !origem && !chaveOrigem) continue; // linha totalmente vazia -- fim da tabela
    records.push({
      _excelRow: r+1,
      posicao: posicao,
      origem: origem,
      dataProgramacao: baseAppReadDateCell(sheet, r, colMap["DATA_PROGRAMACAO"]),
      turno: normTurnoBaseApp(cell("TURNO")),
      turnoBruto: cell("TURNO").trim(),
      prensa: cell("PRENSA").trim().toUpperCase(),
      ferramenta: ferramenta,
      cliente: cell("CLIENTE").trim(),
      quantidadeKg: baseAppReadNumCell(sheet, r, colMap["QUANTIDADE_KG"]),
      corte: cell("CORTE").trim(),
      liga: cell("LIGA").trim(),
      observacao: cell("OBSERVACAO").trim(),
      ordemOrigem: cell("ORDEM_ORIGEM").trim() ? parseInt(cell("ORDEM_ORIGEM"),10) : null,
      chaveOrigem: chaveOrigem,
      secao: cell("SECAO").trim().toUpperCase()
    });
  }
  return { sheetName: sheetName, records: records };
}
function baseAppUniq(arr){ var seen={}; return arr.filter(function(v){ if(seen[v]) return false; seen[v]=true; return true; }); }
// Validações defensivas do app, mesmo confiando no VBA — a BASE_APP real
// analisada continha pelo menos 1 linha com FERRAMENTA vazia (um "TOTAL"
// vazado da consolidação) mesmo com o banner "SEM DIVERGÊNCIAS"; por
// isso essas checagens nunca são puladas.
function validateBaseAppRecords(records){
  var errors = [], warnings = [];
  if(!records.length){ errors.push("Nenhuma linha de dados encontrada na BASE_APP."); return { errors:errors, warnings:warnings }; }

  records.forEach(function(rec){
    var loc = "Linha "+rec._excelRow;
    if(BASE_APP_POSICOES.indexOf(rec.posicao)===-1) errors.push(loc+": POSICAO_PROGRAMACAO inválida ("+(rec.posicao||"vazia")+").");
    if(!rec.ferramenta) errors.push(loc+": FERRAMENTA vazia.");
    if(rec.quantidadeKg==null) errors.push(loc+": QUANTIDADE_KG ausente.");
    else if(rec.quantidadeKg<=0) errors.push(loc+": QUANTIDADE_KG deve ser maior que zero (encontrado "+rec.quantidadeKg+").");
    if(["P7","P4"].indexOf(rec.prensa)===-1) errors.push(loc+": PRENSA inválida ("+(rec.prensa||"vazia")+").");
    if(["Dia","Noite"].indexOf(rec.turno)===-1) errors.push(loc+": TURNO inválido ("+(rec.turnoBruto||"vazio")+").");
    if(!rec.dataProgramacao) errors.push(loc+": DATA_PROGRAMACAO inválida ou ausente.");
    if(!rec.chaveOrigem) errors.push(loc+": CHAVE_ORIGEM ausente.");
    if(["PRINCIPAL","RESERVA"].indexOf(rec.secao)===-1) errors.push(loc+": SECAO inválida ("+(rec.secao||"vazia")+") — esperado PRINCIPAL ou RESERVA.");
  });

  var chaveCounts = {};
  records.forEach(function(rec){ if(rec.chaveOrigem) chaveCounts[rec.chaveOrigem]=(chaveCounts[rec.chaveOrigem]||0)+1; });
  Object.keys(chaveCounts).forEach(function(k){ if(chaveCounts[k]>1) errors.push("CHAVE_ORIGEM duplicada: "+k+" ("+chaveCounts[k]+"x)."); });

  var porPosicao = {};
  records.forEach(function(rec){
    if(BASE_APP_POSICOES.indexOf(rec.posicao)===-1) return;
    if(!porPosicao[rec.posicao]) porPosicao[rec.posicao]=[];
    porPosicao[rec.posicao].push(rec);
  });
  var origemToPosicoes = {};
  Object.keys(porPosicao).forEach(function(pos){
    var recs = porPosicao[pos];
    var datas = baseAppUniq(recs.map(function(r){return r.dataProgramacao;}).filter(Boolean));
    var turnos = baseAppUniq(recs.map(function(r){return r.turno;}).filter(Boolean));
    if(datas.length>1) errors.push(pos+": DATA_PROGRAMACAO incoerente entre linhas da mesma posição ("+datas.join(", ")+").");
    if(turnos.length>1) errors.push(pos+": TURNO incoerente entre linhas da mesma posição ("+turnos.join(", ")+").");
    var origem = recs[0] && recs[0].origem;
    if(origem){ if(!origemToPosicoes[origem]) origemToPosicoes[origem]=[]; origemToPosicoes[origem].push(pos); }
  });
  Object.keys(origemToPosicoes).forEach(function(origem){
    var posicoes = baseAppUniq(origemToPosicoes[origem]);
    if(posicoes.length>1) errors.push('A mesma ORIGEM ("'+origem+'") está selecionada em mais de uma posição: '+posicoes.join(", ")+".");
  });

  // Ordem cronológica -- ALERTA (não bloqueia); a prioridade operacional
  // escolhida pelo PCP prevalece, mas a inconsistência precisa ficar
  // visível e exigir confirmação explícita antes de prosseguir.
  var slots = {};
  Object.keys(porPosicao).forEach(function(pos){
    var recs = porPosicao[pos];
    if(recs.length && recs[0].dataProgramacao) slots[pos] = { data: recs[0].dataProgramacao, turno: recs[0].turno };
  });
  function slotOrdem(s){ return s ? (s.data + (s.turno==="Noite" ? "_2" : "_1")) : null; }
  if(slots.ATUAL && slots.PROXIMA && slotOrdem(slots.PROXIMA) < slotOrdem(slots.ATUAL)){
    warnings.push("PRÓXIMA ("+fmtDateBR(slots.PROXIMA.data)+" — "+slots.PROXIMA.turno+") é cronologicamente anterior a ATUAL ("+fmtDateBR(slots.ATUAL.data)+" — "+slots.ATUAL.turno+"). Confira se a seleção está correta.");
  }
  if(slots.ATUAL && slots.FUTURA && slotOrdem(slots.FUTURA) < slotOrdem(slots.ATUAL)){
    warnings.push("FUTURA ("+fmtDateBR(slots.FUTURA.data)+" — "+slots.FUTURA.turno+") é cronologicamente anterior a ATUAL ("+fmtDateBR(slots.ATUAL.data)+" — "+slots.ATUAL.turno+"). Confira se a seleção está correta.");
  }

  return { errors: errors, warnings: warnings };
}
function baseAppGroupByPosicao(records){
  var groups = {};
  records.forEach(function(r){
    if(BASE_APP_POSICOES.indexOf(r.posicao)===-1) return;
    if(!groups[r.posicao]) groups[r.posicao]=[];
    groups[r.posicao].push(r);
  });
  return groups;
}
// Hash determinístico de conteúdo (djb2) — não criptográfico, só precisa
// detectar mudança de conteúdo de forma estável. ORIGEM/CHAVE_ORIGEM/
// ORDEM_ORIGEM/POSICAO_PROGRAMACAO ficam DE FORA de propósito: descrevem
// de onde o dado veio no Excel, não o que o dado é — incluí-los geraria
// falso "conteúdo mudou" toda vez que a mesma programação fosse digitada
// numa aba nova. As linhas são ordenadas antes de hashear para que a
// ordem de digitação no Excel nunca afete o resultado.
function baseAppHashString(s){
  var h = 5381;
  for(var i=0;i<s.length;i++){ h = ((h*33) ^ s.charCodeAt(i)) >>> 0; }
  return h.toString(36);
}
function computeConteudoHash(records){
  var linhas = records.map(function(r){
    return [r.prensa, r.ferramenta, r.cliente||"", r.quantidadeKg, r.corte||"", r.liga||"", r.observacao||"", r.secao].join("§");
  });
  linhas.sort();
  return baseAppHashString(linhas.join("¶"));
}
function baseAppFindVigenteParaSlot(data, turno){
  var keys = Object.keys(state.programacoesByKey);
  for(var i=0;i<keys.length;i++){
    var p = state.programacoesByKey[keys[i]];
    if(p.vigente && p.data===data && p.turno===turno) return Object.assign({id:keys[i]}, p);
  }
  return null;
}
function baseAppDiffContent(oldProgramacaoId, newRecs){
  var oldRows = state.ferramentas.filter(function(t){ return t.programacaoId===oldProgramacaoId; });
  function ident(prensa,ferramenta,kg){ return prensa+"|"+ferramenta+"|"+kg; }
  var oldSet = {}; oldRows.forEach(function(t){ oldSet[ident(t.prensa,t.codigo,t.quantidadeKg)]=true; });
  var newSet = {}; newRecs.forEach(function(r){ newSet[ident(r.prensa,r.ferramenta,r.quantidadeKg)]=true; });
  var added=0, removed=0, kgOld=0, kgNew=0;
  oldRows.forEach(function(t){ kgOld += (t.quantidadeKg||0); if(!newSet[ident(t.prensa,t.codigo,t.quantidadeKg)]) removed++; });
  newRecs.forEach(function(r){ kgNew += (r.quantidadeKg||0); if(!oldSet[ident(r.prensa,r.ferramenta,r.quantidadeKg)]) added++; });
  return { added: added, removed: removed, kgDelta: Math.round((kgNew-kgOld)*100)/100 };
}
// Monta o plano de importação: para cada posição presente, decide se é
// NOVA / SEM_ALTERACAO / MUDANCA_PAPEL / NOVA_VERSAO comparando contra a
// programação vigente do mesmo slot (data+turno), via conteudoHash.
// Puramente de leitura/cálculo — nenhuma escrita acontece aqui.
function baseAppBuildPlan(recordsByPosicao){
  var plan = {};
  Object.keys(recordsByPosicao).forEach(function(posicao){
    var recs = recordsByPosicao[posicao];
    if(!recs.length) return;
    var data = recs[0].dataProgramacao;
    var turno = recs[0].turno;
    var origem = recs[0].origem;
    var hash = computeConteudoHash(recs);
    var existing = baseAppFindVigenteParaSlot(data, turno);
    var papel = BASE_APP_PAPEL_MAP[posicao];
    var situacao;
    if(!existing) situacao = "NOVA";
    else if(existing.conteudoHash===hash) situacao = (existing.papel===papel) ? "SEM_ALTERACAO" : "MUDANCA_PAPEL";
    else situacao = "NOVA_VERSAO";
    var totais = { P7:{n:0,kg:0}, P4:{n:0,kg:0} };
    var secaoCount = { PRINCIPAL:0, RESERVA:0 };
    recs.forEach(function(r){
      if(totais[r.prensa]){ totais[r.prensa].n++; totais[r.prensa].kg = Math.round((totais[r.prensa].kg+(r.quantidadeKg||0))*100)/100; }
      if(secaoCount[r.secao]!==undefined) secaoCount[r.secao]++;
    });
    plan[posicao] = {
      posicao: posicao, papel: papel, data: data, turno: turno, origem: origem,
      hash: hash, records: recs, totais: totais, secaoCount: secaoCount,
      situacao: situacao, existing: existing,
      diff: situacao==="NOVA_VERSAO" ? baseAppDiffContent(existing.id, recs) : null
    };
  });
  return plan;
}
// Programações hoje vigentes cujo slot (data+turno) NÃO está representado
// em nenhuma posição da nova BASE_APP — nem como substituição no mesmo
// slot (NOVA_VERSAO/MUDANCA_PAPEL, já tratadas dentro do próprio plano).
// São candidatas a encerramento, mas NUNCA arquivadas automaticamente:
// só entram na prévia, e só viram histórica se o PCP confirmar
// explicitamente (mesmo cuidado pedido para não arquivar silenciosamente
// uma programação noturna que ainda possa estar em uso).
function baseAppFindProgramacoesOrfas(plan){
  var slotsNovos = {};
  Object.keys(plan).forEach(function(pos){
    var e = plan[pos];
    slotsNovos[e.data+"|"+e.turno] = true;
  });
  var idsJaTratados = {};
  Object.keys(plan).forEach(function(pos){
    var e = plan[pos];
    if(e.existing) idsJaTratados[e.existing.id] = true;
  });
  var orfas = [];
  Object.keys(state.programacoesByKey).forEach(function(id){
    var p = state.programacoesByKey[id];
    if(!p.vigente || p.papel==="historica") return;
    if(idsJaTratados[id]) return;
    if(!slotsNovos[p.data+"|"+p.turno]){
      orfas.push(Object.assign({id:id}, p));
    }
  });
  return orfas;
}
function baseAppPrepareImport(wb){
  var parsed = parseBaseAppSheet(wb);
  if(parsed.error){ state.baseAppImport = { step:"erro", error: parsed.error }; render(); return; }
  var val = validateBaseAppRecords(parsed.records);
  if(val.errors.length){
    state.baseAppImport = { step:"erro-validacao", errors: val.errors, warnings: val.warnings };
    render(); return;
  }
  var groups = baseAppGroupByPosicao(parsed.records);
  var plan = baseAppBuildPlan(groups);
  if(!Object.keys(plan).length){
    state.baseAppImport = { step:"erro-validacao", errors:["Nenhuma posição válida (ATUAL/PROXIMA/FUTURA) encontrada na BASE_APP."], warnings:[] };
    render(); return;
  }
  var orfas = baseAppFindProgramacoesOrfas(plan);
  var precisaCiencia = val.warnings.length>0 || orfas.length>0;
  state.baseAppImport = { step:"previa", warnings: val.warnings, plan: plan, orfas: orfas, cienteAlertas: !precisaCiencia, busy:false, error:"", resultados:null };
  render();
}
function handleBaseAppFile(file){
  state.baseAppImport = { step:"carregando" };
  render();
  ensureXLSX(function(){
    var reader = new FileReader();
    reader.onload = function(e){
      try{
        var data = new Uint8Array(e.target.result);
        var wb = XLSX.read(data, {type:"array"});
        baseAppPrepareImport(wb);
      }catch(err){
        state.baseAppImport = { step:"erro", error: "Erro ao ler arquivo: "+(err&&err.message||"") };
        render();
      }
    };
    reader.onerror = function(){ state.baseAppImport = { step:"erro", error:"Erro ao ler arquivo." }; render(); };
    reader.readAsArrayBuffer(file);
  });
}
function baseAppGenerateProgramacaoId(){
  var now = new Date();
  var pad2 = function(n){ return ("0"+n).slice(-2); };
  var ts = now.getFullYear()+pad2(now.getMonth()+1)+pad2(now.getDate())+"-"+pad2(now.getHours())+pad2(now.getMinutes())+pad2(now.getSeconds());
  var rand = Math.random().toString(36).slice(2,6);
  return "PROG-"+ts+"-"+rand;
}
function baseAppBuildFerramentaDoc(rec, programacaoId, now){
  return {
    codigo: rec.ferramenta, cliente: rec.cliente, quantidadeKg: rec.quantidadeKg,
    corte: rec.corte, liga: rec.liga, tipo: (rec.secao==="RESERVA" ? "Reserva" : "Programação"),
    prensa: rec.prensa, turno: rec.turno, dataProgramacao: rec.dataProgramacao,
    observacaoPCP: rec.observacao||"",
    solicitadoPor: { uid: state.user.uid, nome: state.user.nome },
    criadoEm: now, programacaoId: programacaoId, chaveOrigem: rec.chaveOrigem, origemBase: "BASE_APP"
  };
}
// Gravação segura de UMA posição do plano. NOVA/NOVA_VERSAO: grava TODOS
// os documentos novos primeiro (ferramentas + necessidades), e só cria o
// doc de programacoes (que é o que efetivamente "ativa" a nova versão)
// depois de tudo confirmado — e só DEPOIS DISSO, como último passo,
// aposenta a versão anterior (papel:"historica", vigente:false). Se
// qualquer coisa falhar antes do doc de programacoes ser criado, nada
// muda do ponto de vista operacional: a versão anterior continua
// vigente, e os documentos novos ficam órfãos (sem nenhum programacoes
// vigente apontando pra eles) — logo isRecordActive nunca os mostra.
function baseAppWritePosicao(entry){
  if(entry.situacao==="SEM_ALTERACAO") return Promise.resolve({posicao:entry.posicao, ok:true, acao:"nenhuma", programacaoId: entry.existing && entry.existing.id});
  if(entry.situacao==="MUDANCA_PAPEL"){
    return withPermissionRetry(function(){
      return state.db.doc("programacoes/"+entry.existing.id).update({ papel: entry.papel });
    }).then(function(){ return {posicao:entry.posicao, ok:true, acao:"papel", programacaoId:entry.existing.id}; })
      .catch(function(err){ return {posicao:entry.posicao, ok:false, erro: err&&err.message}; });
  }
  var novoId = baseAppGenerateProgramacaoId();
  var now = new Date().toISOString();
  var writes = entry.records.map(function(rec){
    var doc = baseAppBuildFerramentaDoc(rec, novoId, now);
    return withPermissionRetry(function(){
      return state.db.collection("ferramentas").add(doc).then(function(){ return upsertNecessidadeDelta(doc, 1); });
    });
  });
  return Promise.all(writes).then(function(){
    return withPermissionRetry(function(){
      return state.db.doc("programacoes/"+novoId).set({
        programacaoId: novoId, data: entry.data, turno: entry.turno, papel: entry.papel, vigente: true,
        substituiId: entry.existing ? entry.existing.id : null, substituidaPorId: null,
        conteudoHash: entry.hash, origemBase: "BASE_APP", origemAba: entry.origem,
        criadaEm: state.db.serverTimestamp(), criadaPor: { uid: state.user.uid, nome: state.user.nome },
        substituidaEm: null, encerradaEm: null, encerradaPor: null, totais: entry.totais
      });
    });
  }).then(function(){
    if(!entry.existing) return Promise.resolve();
    return withPermissionRetry(function(){
      return state.db.doc("programacoes/"+entry.existing.id).update({
        papel: "historica", vigente: false, substituidaPorId: novoId, substituidaEm: state.db.serverTimestamp()
      });
    });
  }).then(function(){
    return {posicao:entry.posicao, ok:true, acao: entry.situacao==="NOVA"?"nova":"nova_versao", programacaoId:novoId};
  }).catch(function(err){
    return {posicao:entry.posicao, ok:false, erro: err&&err.message, programacaoIdParcial:novoId};
  });
}
// Encerra uma programação vigente órfã (slot não representado na nova
// BASE_APP) — só troca papel/vigência/encerradaEm/encerradaPor no doc de
// programacoes; NUNCA toca em ferramentas/necessidades/status/urgencias,
// que continuam intactas para Auditoria/Histórico.
function baseAppEncerrarOrfa(orfa){
  return withPermissionRetry(function(){
    return state.db.doc("programacoes/"+orfa.id).update({
      papel: "historica", vigente: false,
      encerradaEm: state.db.serverTimestamp(),
      encerradaPor: { uid: state.user.uid, nome: state.user.nome }
    });
  }).then(function(){ return {id:orfa.id, ok:true}; })
    .catch(function(err){ return {id:orfa.id, ok:false, erro: err&&err.message}; });
}
function doConfirmBaseAppImport(){
  var bi = state.baseAppImport;
  if(!bi || bi.step!=="previa" || bi.busy || !state.db) return;
  bi.busy = true; bi.error=""; render();
  var entries = Object.keys(bi.plan).map(function(k){ return bi.plan[k]; });
  var orfas = bi.orfas||[];
  Promise.all([
    Promise.all(entries.map(baseAppWritePosicao)),
    Promise.all(orfas.map(baseAppEncerrarOrfa))
  ]).then(function(res){
    var resultados = res[0], resultadosOrfas = res[1];
    bi.busy = false;
    var falhas = resultados.filter(function(r){ return !r.ok; }).concat(resultadosOrfas.filter(function(r){ return !r.ok; }));
    if(falhas.length){
      bi.error = "Falha ao gravar " + falhas.map(function(f){ return (f.posicao||f.id)+" ("+(f.erro||"erro desconhecido")+")"; }).join("; ") + ". As posições que já foram gravadas com sucesso permanecem válidas; tente novamente para as que falharam.";
      bi.resultados = resultados;
      bi.resultadosOrfas = resultadosOrfas;
      render();
      return;
    }
    bi.step = "concluido";
    bi.resultados = resultados;
    bi.resultadosOrfas = resultadosOrfas;
    state.toast = "BASE_APP importada com sucesso.";
    render();
  });
}

/* ================= SUBSCRIPTIONS ================= */
function startSubs(){
  if(!state.db) return;
  if(state.user.perfil==="pcp" && !state.unsub){
    state.unsub = state.db.collection("ferramentas").limit(2000).onSnapshot(function(snap){
      state.ferramentas = snap.docs.map(function(d){ var v=d.data(); v.id=d.id; return v; });
      state.dataLoaded = true;
      render();
    }, function(err){
      state.dataLoaded = true;
      state.toast = "Conexão de dados interrompida.";
      render();
    });
  }
  if(state.user.perfil==="correcao" && !state.unsubNecessidades){
    state.unsubNecessidades = state.db.collection("necessidades").limit(2000).onSnapshot(function(snap){
      var map = {};
      snap.docs.forEach(function(d){
        if(d.id===SYNC_META_DOC_ID){ state.syncMeta = d.data(); return; }
        map[d.id] = d.data();
      });
      state.necessidadesByKey = map;
      state.dataLoaded = true;
      render();
    }, function(err){
      state.dataLoaded = true;
      state.toast = "Conexão de dados interrompida.";
      render();
    });
  }
  if(!state.unsubStatus){
    state.unsubStatus = state.db.collection("status").limit(2000).onSnapshot(function(snap){
      var map = {};
      snap.docs.forEach(function(d){ map[d.id] = d.data(); });
      state.statusByKey = map;
      render();
    }, function(err){ /* status is supplementary; keep going without it */ });
  }
  // Coleção programacoes (Etapa 3) — lida por PCP e Correção (os dois
  // precisam de isRecordActive funcionando corretamente nos seus próprios
  // filtros). Enquanto nenhum doc existir (estado de hoje), o mapa fica
  // vazio e isRecordActive() é um no-op — comportamento idêntico à v1.2.
  if(!state.unsubProgramacoes){
    state.unsubProgramacoes = state.db.collection("programacoes").limit(500).onSnapshot(function(snap){
      var map = {};
      snap.docs.forEach(function(d){ map[d.id] = d.data(); });
      state.programacoesByKey = map;
      render();
    }, function(err){ /* preparatório e informativo; nunca bloqueia o resto do app */ });
  }
  if(!state.unsubUrgencias){
    state.unsubUrgencias = state.db.collection("urgencias").limit(500).onSnapshot(function(snap){
      var map = {};
      snap.docs.forEach(function(d){ map[d.id] = d.data(); });
      // Dispara o pulso curto (alguns segundos) para toda urgência ativa e
      // ainda não reconhecida que seja NOVA nesta leitura — seja porque
      // acabou de ser criada pelo PCP com o app da Correção já aberto, seja
      // porque é a primeira leitura da sessão (garante que uma urgência já
      // existente não passe despercebida ao abrir o app).
      var prev = state._prevUrgencias || {};
      var now = Date.now();
      var anyNew = false;
      Object.keys(map).forEach(function(k){
        var u = map[k];
        var isAtivaNaoRec = !!(u.urgente && !u.reconhecida);
        var eraAtivaNaoRec = !!(prev[k] && prev[k].urgente && !prev[k].reconhecida);
        if(isAtivaNaoRec && !eraAtivaNaoRec){ state.urgentPulseUntil[k] = now + 3800; anyNew = true; }
      });
      state._prevUrgencias = map;
      state.urgenciasByKey = map;
      render();
      if(anyNew) setTimeout(render, 3900);
    }, function(err){ /* urgência é informativa; nunca bloqueia o resto do app */ });
  }
}

/* ================= SETUP SCREEN (shown when Firebase isn't configured) ================= */
function renderSetupNotice(){
  return '<div class="setup-wrap"><div class="box">' +
    '<h2 style="font-size:20px;margin-bottom:10px;">Configuração pendente</h2>' +
    '<p class="hint" style="font-size:13.5px;line-height:1.5;">Este app ainda não está conectado a um banco de dados. Abra o arquivo <b>index.html</b>, procure por <b>FIREBASE_CONFIG</b> perto do topo, e cole ali a configuração do seu projeto Firebase (Console do Firebase → Configurações do projeto → Seus apps → SDK).</p>' +
  '</div></div>';
}

/* ================= INIT ================= */
render();
(window.__FIREBASE_DB_PROMISE || Promise.resolve(null)).then(function(result){
  if(!result){
    state.dbReady = true; state.user = null; render();
    app.innerHTML += renderSetupNotice();
    return;
  }
  state.db = result.db;
  window.__AUTH_API = result.authApi;
  state.dbReady = true;
  if(result.initialUid){
    state.db.doc("users/"+result.initialUid).get().then(function(snap){
      if(snap.exists){
        var data = snap.data();
        state.user = { uid: result.initialUid, nome: data.nome, perfil: data.role };
        render(); startSubs();
      } else {
        state.user = null; render();
      }
    }).catch(function(){ state.user = null; render(); });
  } else {
    state.user = null; render();
  }
}).catch(function(){
  state.dbReady = true; render();
});

})();
</script>
