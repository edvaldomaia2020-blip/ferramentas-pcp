    if(codEl) codEl.value = state.newTool.codigo||"";
    if(kgEl) kgEl.value = state.newTool.kg||"";
    if(obsEl) obsEl.value = state.newTool.obs||"";
    if(clienteEl) clienteEl.value = state.newTool.cliente||"";
    if(corteEl) corteEl.value = state.newTool.corte||"";
    if(ligaEl) ligaEl.value = state.newTool.liga||"";
  }

  app.querySelectorAll('[data-action="toggle-nec-expand"]').forEach(function(el){
    el.addEventListener("click", function(){
      var key = el.getAttribute("data-key");
      state.necExpanded[key] = !state.necExpanded[key];
      render();
    });
  });
  app.querySelectorAll('[data-action="toggle-nec-ok"]').forEach(function(el){
    el.addEventListener("change", function(){ toggleNecOk(el.getAttribute("data-key")); });
  });
  app.querySelectorAll('[data-action="set-nec-status"]').forEach(function(el){
    el.addEventListener("click", function(){ setNecField(el.getAttribute("data-key"), "status", el.getAttribute("data-value")); });
  });
  app.querySelectorAll('[data-action="set-nec-prev"]').forEach(function(el){
    el.addEventListener("click", function(){ setNecField(el.getAttribute("data-key"), "previsaoLiberacao", el.getAttribute("data-value")||null); });
  });
  app.querySelectorAll('[data-action="nec-obs-input"]').forEach(function(el){
    el.addEventListener("change", function(){ setNecField(el.getAttribute("data-key"), "observacaoCorrecao", el.value.trim()); });
  });
  var markAllBtn = app.querySelector('[data-action="mark-all-ok"]');
  if(markAllBtn) markAllBtn.addEventListener("click", markAllOk);
  var savePendingBtn = app.querySelector('[data-action="save-pending"]');
  if(savePendingBtn) savePendingBtn.addEventListener("click", savePendingChanges);
  var discardPendingBtn = app.querySelector('[data-action="discard-pending"]');
  if(discardPendingBtn) discardPendingBtn.addEventListener("click", function(){ state.necPending={}; render(); });
}

/* ================= CORREÇÃO: staged edits ================= */
function findGroup(key){ return getCorrecaoGroups().find(function(g){return g.key===key;}); }
function toggleNecOk(key){
  var eff = effectiveNecStatus(key);
  var g = findGroup(key);
  var base = { codigo: g&&g.codigo, prensa: g&&g.prensa, data: g&&g.data };
  if(eff.status==="OK"){
    state.necPending[key] = Object.assign({}, base, { status:"Pendente", previsaoLiberacao:null, observacaoCorrecao: eff.observacaoCorrecao||"" });
  } else {
    state.necPending[key] = Object.assign({}, base, { status:"OK", previsaoLiberacao:null, observacaoCorrecao: eff.observacaoCorrecao||"" });
  }
  render();
}
function setNecField(key, field, value){
  var eff = effectiveNecStatus(key);
  var g = findGroup(key);
  var draft = state.necPending[key] || { status:eff.status, previsaoLiberacao:eff.previsaoLiberacao, observacaoCorrecao:eff.observacaoCorrecao, codigo:g&&g.codigo, prensa:g&&g.prensa, data:g&&g.data };
  draft[field] = value;
  state.necPending[key] = draft;
  render();
}
function markAllOk(){
  var groups = getCorrecaoGroups();
  if(!groups.length) return;
  if(!confirm("Marcar todas as "+groups.length+" ferramentas de "+state.correcaoPrensa+" como OK?")) return;
  groups.forEach(function(g){
    var eff = effectiveNecStatus(g.key);
    state.necPending[g.key] = { status:"OK", previsaoLiberacao:null, observacaoCorrecao: eff.observacaoCorrecao||"", codigo:g.codigo, prensa:g.prensa, data:g.data };
  });
  render();
}
function savePendingChanges(){
  var keys = Object.keys(state.necPending);
  if(!keys.length || !state.db) return;
  var now = new Date().toISOString();
  var promises = keys.map(function(key){
    var draft = state.necPending[key];
    var existing = state.statusByKey[key];
    var histEntry = {
      status: draft.status,
      previsaoLiberacao: draft.previsaoLiberacao||null,
      observacaoCorrecao: draft.observacaoCorrecao||"",
      usuario: { uid: state.user.uid, nome: state.user.nome },
      dataHora: now
    };
    var ref = state.db.doc("status/"+key);
    var base = {
      status: draft.status,
      previsaoLiberacao: draft.previsaoLiberacao||null,
      observacaoCorrecao: draft.observacaoCorrecao||"",
      atualizadoPor: { uid: state.user.uid, nome: state.user.nome },
      atualizadoEm: now
    };
    return withPermissionRetry(function(){
      if(existing){
        return ref.update(Object.assign({}, base, { historico: state.db.arrayUnion(histEntry) }));
      } else {
        return ref.set(Object.assign({}, base, { codigo: draft.codigo, prensa: draft.prensa, data: draft.data, historico: [histEntry] }));
      }
    });
  });
  Promise.all(promises).then(function(){
    state.necPending = {};
    state.toast = keys.length+" atualização(ões) salva(s).";
    render();
  }).catch(function(err){ state.toast="Erro ao salvar: "+(err&&err.message||""); render(); });
}

/* ================= WRITES (PCP) ================= */
/* Retry once, after a short pause, if Firestore momentarily denies a write
   right after a login/account switch (token propagation race) — never
   retries a write that is genuinely not permitted. */
function withPermissionRetry(fn){
  return fn().catch(function(err){
    if(err && err.code==="permission-denied"){
      return new Promise(function(resolve){ setTimeout(resolve, 700); }).then(fn);
    }
    throw err;
  });
}
function upsertNecessidadeDelta(t, sign){
  if(!state.db) return Promise.resolve();
  var key = necDocId(t.codigo, t.prensa, t.dataProgramacao);
  var kg = (t.quantidadeKg||0) * sign;
  var body = {
    codigo: t.codigo, prensa: t.prensa, data: t.dataProgramacao,
    kgTotal: state.db.increment(kg),
    count: state.db.increment(sign)
  };
  if(t.tipo==="Reserva") body.kgReserva = state.db.increment(kg); else body.kgProgramacao = state.db.increment(kg);
  if(sign>0 && t.observacaoPCP) body.observacoes = state.db.arrayUnion(t.observacaoPCP);
  return state.db.doc("necessidades/"+key).set(body, {merge:true});
}

function submitNewTool(){
  var codigo = document.getElementById("nt-codigo").value.trim().toUpperCase();
  var kg = parseFloat(document.getElementById("nt-kg").value);
  var data = document.getElementById("nt-data").value || todayStr();
  var obs = document.getElementById("nt-obs").value.trim();
  var cliente = document.getElementById("nt-cliente").value.trim();
  var corte = document.getElementById("nt-corte").value.trim();
  var liga = document.getElementById("nt-liga").value.trim();
  state.newTool.codigo = codigo; state.newTool.kg = document.getElementById("nt-kg").value; state.newTool.obs = obs; state.newTool.data = data;
  state.newTool.cliente = cliente; state.newTool.corte = corte; state.newTool.liga = liga;
  if(!codigo || isNaN(kg) || kg<0){ state.authError="Informe código e quantidade válidos."; render(); return; }
  if(!state.db){ return; }
  var doc = {
    codigo: codigo,
    cliente: cliente,
    quantidadeKg: kg,
    corte: corte,
    liga: liga,
    tipo: state.newTool.tipo || "Programação",
    prensa: state.newTool.prensa,
    turno: state.newTool.turno,
    dataProgramacao: data,
    observacaoPCP: obs,
    solicitadoPor: { uid: state.user.uid, nome: state.user.nome },
    criadoEm: new Date().toISOString()
  };
  withPermissionRetry(function(){
    return state.db.collection("ferramentas").add(doc).then(function(){
      return upsertNecessidadeDelta(doc, 1);
    });
  }).then(function(){
    state.modal=null; state.toast="Ferramenta enviada para a Correção."; render();
  }).catch(function(err){ state.authError="Erro ao salvar: "+(err&&err.message||""); render(); });
}

function deleteTool(id){
  if(!state.db) return;
  var t = state.ferramentas.find(function(x){return x.id===id;});
  withPermissionRetry(function(){
    return state.db.doc("ferramentas/"+id).delete().then(function(){
      if(t) return upsertNecessidadeDelta(t, -1);
    });
  }).then(function(){ state.toast="Solicitação excluída."; render(); })
    .catch(function(err){ state.toast="Erro ao excluir: "+(err&&err.message||""); render(); });
}

/* ================= IMPORT FROM SPREADSHEET ================= */
function ensureXLSX(cb){
  if(window.XLSX){ cb(); return; }
  var s = document.createElement("script");
  s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
  s.onload = cb;
  s.onerror = function(){ state.import.loading=false; state.import.error="Não foi possível carregar o leitor de planilhas (verifique a conexão)."; render(); };
  document.head.appendChild(s);
}
function sheetToGrid(sheet){
  return XLSX.utils.sheet_to_json(sheet, {header:1, defval:"", raw:false});
}
function handleImportFile(file){
  state.import.loading = true; state.import.error=""; render();
  ensureXLSX(function(){
    var reader = new FileReader();
    reader.onload = function(e){
      try{
        var data = new Uint8Array(e.target.result);
        var wb = XLSX.read(data, {type:"array"});
        initImportFromWorkbook(wb);
      }catch(err){
        state.import.loading=false; state.import.error="Erro ao ler arquivo: "+(err&&err.message||""); render();
      }
    };
    reader.onerror = function(){ state.import.loading=false; state.import.error="Erro ao ler arquivo."; render(); };
    reader.readAsArrayBuffer(file);
  });
}
function initImportFromWorkbook(wb){
  var names = wb.SheetNames;
  var chosen = names[0];
  for(var i=0;i<names.length;i++){
    var g = sheetToGrid(wb.Sheets[names[i]]);
    var found = g.some(function(row){ return row.some(function(c){ return normalizeHeader(c).indexOf("FERRAMENTA")>=0; }); });
    if(found){ chosen = names[i]; break; }
  }
  state.import.loading = false;
  state.import.workbook = wb;
  state.import.sheetNames = names;
  loadImportSheet(chosen);
}
function loadImportSheet(name){
  var grid = sheetToGrid(state.import.workbook.Sheets[name]);
  state.import.sheetName = name;
  state.import.grid = grid;
  state.import.headerRowIndex = autoDetectHeaderRow(grid);
  state.import.colMap = autoColMap(grid, state.import.headerRowIndex);
  state.import.rowChecked = {};
  state.import.rowTipoOverride = {};
  render();
}
function buildImportDocs(){
  var imp = state.import;
  if(!imp || !imp.grid) return [];
  var rows = classifyRows(imp.grid, imp.headerRowIndex);
  var toCreate = rows.filter(function(r){ return r.kind==="data" && imp.rowChecked[r.index]!==false; });
  var now = new Date().toISOString();
  return toCreate.map(function(r){
    function cell(field){ var idx=imp.colMap[field]; return idx===undefined? "" : (r.cells[idx]||"").toString().trim(); }
    var tipo = imp.rowTipoOverride[r.index] || r.tipo;
    return {
      codigo: cell("codigo").toUpperCase(),
      cliente: cell("cliente"),
      quantidadeKg: parseKg(cell("quantidadeKg")),
      corte: cell("corte"),
      liga: cell("liga"),
      tipo: tipo,
      prensa: imp.prensa,
      turno: imp.turno,
      dataProgramacao: imp.data,
      observacaoPCP: cell("observacaoPCP"),
      solicitadoPor: { uid: state.user.uid, nome: state.user.nome },
      criadoEm: now
    };
  }).filter(function(d){ return d.codigo; });
}
function doConfirmImport(){
  var imp = state.import;
  if(imp.colMap.codigo===undefined || imp.colMap.quantidadeKg===undefined){ imp.error="Selecione as colunas de Código e Quantidade (kg)."; render(); return; }
  var docs = buildImportDocs();
  if(!docs.length){ imp.error="Nenhuma linha selecionada."; render(); return; }
  if(!state.db) return;
  imp.busy = true; imp.error=""; render();
  var proceed = function(){
    Promise.all(docs.map(function(d){
      return withPermissionRetry(function(){ return state.db.collection("ferramentas").add(d).then(function(){ return upsertNecessidadeDelta(d, 1); }); });
    })).then(function(){
      imp.busy=false; state.modal=null; state.import=null; state.toast=docs.length+" ferramentas importadas."; render();
    }).catch(function(err){ imp.busy=false; imp.error="Erro ao importar: "+(err&&err.message||""); render(); });
  };
  if(imp.importMode==="substituir"){
    var toDelete = state.ferramentas.filter(function(t){return t.prensa===imp.prensa && t.turno===imp.turno && t.dataProgramacao===imp.data;});
    Promise.all(toDelete.map(function(t){
      return withPermissionRetry(function(){ return state.db.doc("ferramentas/"+t.id).delete().then(function(){ return upsertNecessidadeDelta(t, -1); }); });
    })).then(proceed).catch(function(err){
      imp.busy=false; imp.error="Erro ao substituir: "+(err&&err.message||""); render();
    });
  } else {
    proceed();
  }
}

/* ================= ESPELHO SYNC (4.ESPELHO) =================
   Importador dedicado para a aba "4.ESPELHO" da Master do PCP. Completamente
   separado do importador genérico acima (que continua funcionando como
   antes, para qualquer outra planilha/aba). Lê só os valores já calculados
   do Excel (nunca tenta recalcular fórmulas), monta uma prévia classificada
   (NOVA / RESERVA→PRINCIPAL / ALTERADA / RETIRADA / SEM ALTERAÇÃO) e só
   grava no Firestore depois de o PCP confirmar explicitamente. */

var ESP_PRINCIPAL_RE = /^Programa[cç][aã]o\s+(P\d+)\s*[—-]+\s*(\d{2}\/\d{2}\/\d{4})\s*[—-]+\s*Turno:\s*(DIA|NOITE)/i;
var ESP_RESERVA_RE = /^PROGRAMA[CÇ][AÃ]O\s+RESERVA.*turno\s+seguinte\s*\((DIA|NOITE)\)/i;
var ESP_TOTAL_RE = /^TOTAL\b/i;

function espBrDateToIso(dd_mm_yyyy){
  var m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(dd_mm_yyyy);
  return m ? (m[3]+"-"+m[2]+"-"+m[1]) : null;
}
function mapEspelhoCols(headerRowCells){
  var map = {};
  headerRowCells.forEach(function(cell, idx){
    var h = normalizeHeader(cell);
    if(map.codigo===undefined && /FERRAMENTA/.test(h)) map.codigo = idx;
    else if(map.cliente===undefined && /CLIENTE/.test(h)) map.cliente = idx;
    else if(map.quantidadeKg===undefined && /QUANT/.test(h)) map.quantidadeKg = idx;
    else if(map.corte===undefined && /CORTE/.test(h)) map.corte = idx;
    else if(map.liga===undefined && /^LIGA/.test(h)) map.liga = idx;
    else if(map.barras===undefined && /BARRA/.test(h)) map.barras = idx;
    else if(map.observacaoPCP===undefined && /OBSERV/.test(h)) map.observacaoPCP = idx;
  });
  return map;
}
// Célula "QUANT. (KG)" vem formatada pelo XLSX.js como texto (ex: "1,445 KG").
// Verificado contra os valores calculados reais do arquivo: "," aqui é
// separador de milhar (não decimal) — kg nesta planilha é sempre inteiro.
function parseKgEspelho(raw){
  var s = (raw==null?"":raw).toString().replace(/[^\d.,\-]/g,"");
  s = s.replace(/,/g, "");
  var n = parseFloat(s);
  return isNaN(n) ? null : n;
}
function espReadSection(grid, titleRow, titleCol){
  var warnings = [];
  var headerRowIdx = titleRow + 1;
  var headerCells = grid[headerRowIdx] ? grid[headerRowIdx].slice(titleCol, titleCol+7) : [];
  var colMap = mapEspelhoCols(headerCells);
  if(colMap.codigo===undefined || colMap.quantidadeKg===undefined){
    warnings.push("Linha "+(headerRowIdx+1)+": não encontrei as colunas FERRAMENTA/QUANT.(KG) esperadas — seção ignorada.");
    return { rows: [], warnings: warnings };
  }
  var rows = [];
  for(var r = headerRowIdx + 1; r < grid.length; r++){
    var firstCell = (grid[r][titleCol] || "").toString().trim();
    if(ESP_TOTAL_RE.test(firstCell)) break;
    if(ESP_PRINCIPAL_RE.test(firstCell) || ESP_RESERVA_RE.test(firstCell)) break;
    function cell(field){
      var idx = colMap[field];
      if(idx===undefined) return "";
      var v = grid[r][titleCol+idx];
      return v==null ? "" : v.toString().trim();
    }
    var codigo = cell("codigo");
    if(!codigo) continue;
    var kg = parseKgEspelho(cell("quantidadeKg"));
    if(kg===null){
      warnings.push("Linha "+(r+1)+": ferramenta \""+codigo+"\" sem quantidade (kg) válida — registro não incluído.");
      continue;
    }
    rows.push({ codigo: codigo.toUpperCase(), cliente: cell("cliente"), quantidadeKg: kg, corte: cell("corte"), liga: cell("liga"), barras: cell("barras"), observacaoPCP: cell("observacaoPCP") });
  }
  return { rows: rows, warnings: warnings };
}
function espScanColumn(grid, titleCol){
  var buckets = [], ignoredReservaNoite = [], warnings = [];
  var currentDate = null, currentPrensa = null;
  for(var r = 0; r < grid.length; r++){
    var cellVal = (grid[r][titleCol] || "").toString().trim();
    if(!cellVal) continue;
    var mP = ESP_PRINCIPAL_RE.exec(cellVal);
    var mR = !mP ? ESP_RESERVA_RE.exec(cellVal) : null;
    if(mP){
      var prensa = mP[1].toUpperCase();
      var dataIso = espBrDateToIso(mP[2]);
      var turno = mP[3].toUpperCase()==="DIA" ? "Dia" : "Noite";
      currentDate = dataIso; currentPrensa = prensa;
      if(!dataIso){ warnings.push("Linha "+(r+1)+": não consegui interpretar a data do título \""+cellVal+"\"."); continue; }
      var sec = espReadSection(grid, r, titleCol);
      buckets.push({ prensa:prensa, turno:turno, tipo:"Programação", turnoOrigem:null, data:dataIso, rows:sec.rows });
      warnings.push.apply(warnings, sec.warnings);
    } else if(mR){
      var turnoAlvo = mR[1].toUpperCase()==="DIA" ? "Dia" : "Noite";
      if(!currentDate || !currentPrensa){
        warnings.push("Linha "+(r+1)+": bloco de reserva sem programação principal antes — ignorado.");
        continue;
      }
      var sec2 = espReadSection(grid, r, titleCol);
      if(turnoAlvo === "Noite"){
        buckets.push({ prensa:currentPrensa, turno:"Noite", tipo:"Reserva", turnoOrigem:"Dia", data:currentDate, rows:sec2.rows });
        warnings.push.apply(warnings, sec2.warnings);
      } else {
        ignoredReservaNoite.push({ prensa:currentPrensa, data:currentDate, count:sec2.rows.length });
      }
    }
  }
  return { buckets:buckets, ignoredReservaNoite:ignoredReservaNoite, warnings:warnings };
}
// Lê o valor BRUTO da célula (não o texto formatado tipo "12-Sep", que
// esconde ano e hora). Se for uma data reconhecível pelo Excel, devolve
// ano/mês/dia/hora/minuto exatos via XLSX.SSF (sem passar por Date/fuso
// horário). Se não for uma data reconhecível, devolve o texto como está,
// sem inventar nada.
function espColLetter(idx){
  var s = ""; idx++;
  while(idx>0){ var m=(idx-1)%26; s=String.fromCharCode(65+m)+s; idx=Math.floor((idx-1)/26); }
  return s;
}
function espReadEmitidoEmCell(sheet, rowIdx, colIdx){
  var addr = espColLetter(colIdx) + (rowIdx+1);
  var cell = sheet[addr];
  if(!cell) return { iso:null, hasTime:false };
  if(cell.t === "n" && typeof cell.v === "number" && window.XLSX && XLSX.SSF && XLSX.SSF.parse_date_code){
    var d = XLSX.SSF.parse_date_code(cell.v);
    if(d && d.y > 1900 && d.y < 2200){
      var pad2 = function(n){ return ("0"+Math.floor(n)).slice(-2); };
      var hasTime = Math.round((d.H||0)*3600+(d.M||0)*60+(d.S||0)) !== 0;
      return {
        iso: d.y+"-"+pad2(d.m)+"-"+pad2(d.d)+"T"+pad2(d.H||0)+":"+pad2(d.M||0)+":"+pad2(d.S||0),
        hasTime: hasTime, y:d.y, mo:d.m, da:d.d, H:d.H||0, Mi:d.M||0
      };
    }
  }
  var raw = cell.w!=null ? cell.w.toString() : (cell.v!=null ? cell.v.toString() : "");
  return raw ? { iso: raw, hasTime:false, isRawText:true } : { iso:null, hasTime:false };
}
function fmtEmitidoEmBR(meta){
  if(!meta || !meta.iso) return "não identificado";
  if(meta.isRawText) return meta.iso;
  var pad2 = function(n){ return ("0"+n).slice(-2); };
  var dataBR = pad2(meta.da)+"/"+pad2(meta.mo)+"/"+meta.y;
  return meta.hasTime ? (dataBR+" "+pad2(meta.H)+":"+pad2(meta.Mi)) : dataBR;
}
function parseEspelhoSheet(grid, sheet){
  var emitidoEm = null, emitidoEmMeta = null;
  for(var r=0; r<Math.min(grid.length,10); r++){
    if(normalizeHeader(grid[r][0]) === "EMITIDO EM"){
      emitidoEmMeta = espReadEmitidoEmCell(sheet, r, 1);
      emitidoEm = emitidoEmMeta.iso;
      break;
    }
  }
  var p7 = espScanColumn(grid, 0);
  var p4 = espScanColumn(grid, 8);
  return {
    emitidoEm: emitidoEm,
    emitidoEmMeta: emitidoEmMeta,
    buckets: p7.buckets.concat(p4.buckets),
    ignoredReservaNoite: p7.ignoredReservaNoite.concat(p4.ignoredReservaNoite),
    warnings: p7.warnings.concat(p4.warnings)
  };
}
function espSignature(row){
  return (row.codigo||"")+"|"+(row.cliente||"")+"|"+(row.quantidadeKg==null?"":row.quantidadeKg)+"|"+(row.corte||"");
}
function espReconcileBucket(bucket, existingDocs, claimedIds){
  var items = [];
  function scoped(pred){
    return existingDocs.filter(function(d){ return d.prensa===bucket.prensa && d.dataProgramacao===bucket.data && !claimedIds.has(d.id) && pred(d); });
  }
  var poolPromotion = (bucket.tipo==="Programação" && bucket.turno==="Noite")
    ? scoped(function(d){ return d.tipo==="Reserva" && d.turnoOrigem==="Dia" && d.turno==="Noite"; }) : [];
  var poolSameBucket = scoped(function(d){
    if(bucket.tipo==="Reserva") return d.tipo==="Reserva" && d.turnoOrigem==="Dia" && d.turno==="Noite";
    return d.tipo==="Programação" && d.turno===bucket.turno && !d.turnoOrigem;
  });
  function bySignature(pool){ var m={}; pool.forEach(function(d){ var s=espSignature(d); (m[s]=m[s]||[]).push(d); }); return m; }
  var promoIdx = bySignature(poolPromotion), sameIdx = bySignature(poolSameBucket);
  var unmatchedNew = [];
  bucket.rows.forEach(function(newRow){
    var sig = espSignature(newRow);
    if(promoIdx[sig] && promoIdx[sig].length){
      var oldP = promoIdx[sig].shift(); claimedIds.add(oldP.id);
      items.push({ type:"PROMOVIDA", newRow:newRow, oldDoc:oldP, prensa:bucket.prensa, data:bucket.data, turno:bucket.turno, tipo:bucket.tipo }); return;
    }
    if(sameIdx[sig] && sameIdx[sig].length){
      var oldS = sameIdx[sig].shift(); claimedIds.add(oldS.id);
      items.push({ type:"SEM_ALTERACAO", newRow:newRow, oldDoc:oldS, prensa:bucket.prensa, data:bucket.data, turno:bucket.turno, tipo:bucket.tipo }); return;
    }
    unmatchedNew.push(newRow);
  });
  var leftoverOld = poolSameBucket.filter(function(d){ return !claimedIds.has(d.id); });
  unmatchedNew.forEach(function(newRow){
    var idx = leftoverOld.findIndex(function(d){ return d.codigo===newRow.codigo && !claimedIds.has(d.id); });
    if(idx>=0){
      var oldA = leftoverOld[idx]; claimedIds.add(oldA.id); leftoverOld.splice(idx,1);
      items.push({ type:"ALTERADA", newRow:newRow, oldDoc:oldA, prensa:bucket.prensa, data:bucket.data, turno:bucket.turno, tipo:bucket.tipo });
    } else {
      items.push({ type:"NOVA", newRow:newRow, oldDoc:null, prensa:bucket.prensa, data:bucket.data, turno:bucket.turno, tipo:bucket.tipo });
    }
  });
  leftoverOld.forEach(function(d){
    if(claimedIds.has(d.id)) return;
    items.push({ type:"RETIRADA", newRow:null, oldDoc:d, prensa:bucket.prensa, data:bucket.data, turno:d.turno, tipo:d.tipo });
    claimedIds.add(d.id);
  });
  return items;
}
function espReconcile(buckets, existingDocs){
  var claimedIds = new Set();
  var allItems = [];
  var ordered = buckets.slice().sort(function(a,b){
    function rank(x){ if(x.tipo==="Programação" && x.turno==="Noite") return 0; if(x.tipo==="Programação") return 1; return 2; }
    return rank(a)-rank(b);
  });
  ordered.forEach(function(bucket){ allItems = allItems.concat(espReconcileBucket(bucket, existingDocs, claimedIds)); });
  var summary = { NOVA:0, PROMOVIDA:0, ALTERADA:0, RETIRADA:0, SEM_ALTERACAO:0 };
  allItems.forEach(function(it){ summary[it.type]++; });
  return { items: allItems, summary: summary };
}

var ESP_TYPE_META = {
  NOVA:          { label:"Novas",                v:"ok" },
  PROMOVIDA:     { label:"Reserva → Principal",   v:"nitretacao" },
  ALTERADA:      { label:"Alteradas",             v:"int" },
  RETIRADA:      { label:"Retiradas (não excluídas)", v:"quebrada" },
  SEM_ALTERACAO: { label:"Sem alteração",         v:"pendente" }
};
function espBucketLabel(b){ return b.prensa+" "+b.turno+(b.tipo==="Reserva" ? " (Reserva p/ Noite)" : ""); }

function renderEspelhoModal(){
  var es = state.espelhoSync;
  if(!es) return "";
  var body = "";
  if(es.step==="pick"){
    body = '' +
      '<div class="field"><label>Selecione o arquivo da Master (.xlsx)</label><input id="esp-file" type="file" accept=".xlsx,.xls"></div>' +
      '<div class="hint">O app procura exclusivamente a aba <b>4.ESPELHO</b>. As demais abas da Master são ignoradas.</div>' +
      (es.loading ? '<div class="hint">Lendo arquivo…</div>' : '') +
      (es.error ? '<div class="error-msg">'+esc(es.error)+'</div>' : '');
  } else if(es.step==="preview"){
    var p = es.parsed, r = es.reconcile;
    body += '<div class="hint" style="background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;">' +
      '<b style="color:var(--text);">Emitido em:</b> '+esc(fmtEmitidoEmBR(p.emitidoEmMeta))+
    '</div>';
    if(es.duplicateWarning){
      body += '<div class="warn-msg"><span>⚠ Este Espelho (emitido em '+esc(fmtEmitidoEmBR(p.emitidoEmMeta))+') já parece ter sido importado antes. Confirmar mesmo assim não cria duplicidade (linhas idênticas entram como "sem alteração"), mas confira antes.</span></div>';
    }
    var totalFound = p.buckets.reduce(function(a,b){return a+b.rows.length;},0);
    body += '<div class="field"><label>Encontrado na 4.ESPELHO ('+totalFound+' registro(s))</label>' +
      '<div style="display:flex;flex-direction:column;gap:4px;">' +
      p.buckets.map(function(b){ return '<div class="hint">'+esc(espBucketLabel(b))+' — '+b.rows.length+' registro(s)</div>'; }).join("") +
      (p.ignoredReservaNoite.length ? p.ignoredReservaNoite.map(function(b){ return '<div class="hint">'+esc(b.prensa)+' Reserva p/ Dia seguinte — '+b.count+' registro(s) <b>ignorados</b> (não importados, por definição do processo)</div>'; }).join("") : '') +
      '</div>' +
    '</div>';
    if(p.warnings.length){
      body += '<div class="warn-msg"><span>⚠ '+p.warnings.length+' aviso(s) durante a leitura:</span>' +
        '<div style="display:flex;flex-direction:column;gap:2px;max-height:120px;overflow:auto;">' +
        p.warnings.map(function(w){ return '<div class="hint">'+esc(w)+'</div>'; }).join("") +
      '</div></div>';
    }
    body += '<div class="field"><label>Classificação das alterações</label><div class="status-grid">' +
      ["NOVA","PROMOVIDA","ALTERADA","RETIRADA","SEM_ALTERACAO"].map(function(t){
        var meta = ESP_TYPE_META[t];
        return '<button type="button" class="status-opt sm" style="color:var(--st-'+meta.v+');" data-action="toggle-esp-group" data-group="'+t+'">'+esc(meta.label)+'<br><span class="mono" style="font-size:15px;">'+r.summary[t]+'</span></button>';
      }).join("") + '</div></div>';
    ["NOVA","PROMOVIDA","ALTERADA","RETIRADA"].forEach(function(t){
      if(!es.expanded[t] || !r.summary[t]) return;
      var meta = ESP_TYPE_META[t];
      body += '<div class="field"><label style="color:var(--st-'+meta.v+');">'+esc(meta.label)+' ('+r.summary[t]+')</label>' +
        '<div style="border:1px solid var(--border);border-radius:8px;max-height:200px;overflow:auto;">' +
        r.items.filter(function(it){return it.type===t;}).map(function(it){
          if(t==="ALTERADA"){
            return '<div style="padding:6px 10px;border-bottom:1px solid var(--border);font-size:12.5px;">' +
              '<b class="mono">'+esc(it.oldDoc.codigo)+'</b> · '+esc(it.prensa)+' · '+fmtDateBR(it.data)+'<br>' +
              '<span class="hint">antes: '+fmtKg(it.oldDoc.quantidadeKg)+' kg, '+esc(it.oldDoc.cliente||"—")+', '+esc(it.oldDoc.corte||"—")+'</span><br>' +
              '<span class="hint">depois: '+fmtKg(it.newRow.quantidadeKg)+' kg, '+esc(it.newRow.cliente||"—")+', '+esc(it.newRow.corte||"—")+'</span>' +
            '</div>';
          }
          var row = it.newRow || it.oldDoc;
          return '<div style="padding:6px 10px;border-bottom:1px solid var(--border);font-size:12.5px;display:flex;justify-content:space-between;gap:8px;">' +
            '<span class="mono">'+esc(row.codigo)+'</span><span class="hint">'+esc(it.prensa)+' · '+esc(it.turno)+' · '+fmtDateBR(it.data)+'</span><span class="mono">'+fmtKg(row.quantidadeKg)+' kg</span>' +
          '</div>';
        }).join("") +
      '</div></div>';
    });
    body += (es.error ? '<div class="error-msg">'+esc(es.error)+'</div>' : '') +
      '<div style="display:flex;gap:8px;">' +
        '<button class="btn btn-ghost" style="flex:1;" data-action="close-modal">Cancelar</button>' +
        '<button class="btn btn-primary" style="flex:2;" data-action="confirm-espelho" '+(es.busy?"disabled":"")+'>'+(es.busy?"Sincronizando…":"Confirmar sincronização")+'</button>' +
      '</div>';
  } else if(es.step==="done"){
    var d = es.done;
    body += '<div class="field"><label style="color:var(--st-ok);">Sincronização concluída</label>' +
      '<div class="hint">Horário: '+fmtDateTimeBR(d.horario)+'</div>' +
    '</div>' +
    '<div class="status-grid">' +
      statTileEsp(d.novas,"Novas") + statTileEsp(d.promovidas,"Reserva→Principal") + statTileEsp(d.alteradas,"Alteradas") +
      statTileEsp(d.mantidas,"Sem alteração") + statTileEsp(d.retiradas,"Retiradas (não excl.)") + statTileEsp(d.erros,"Erros") +
    '</div>' +
    (d.errosDetalhe && d.errosDetalhe.length ? '<div class="error-msg">'+d.errosDetalhe.map(esc).join("<br>")+'</div>' : '') +
    '<button class="btn btn-primary btn-block" data-action="close-espelho-result">Fechar</button>';
  }
  return '' +
  '<div class="modal-overlay" '+(es.step==="pick"?'data-action="close-modal"':'')+'>' +
    '<div class="modal" onclick="event.stopPropagation()">' +
      '<div class="modal-head"><h2>Sincronizar Espelho</h2><button class="modal-close" data-action="close-modal">×</button></div>' +
      body +
    '</div>' +
  '</div>';
}
function statTileEsp(n,lbl){ return '<div class="status-opt sm" style="cursor:default;">'+esc(lbl)+'<br><span class="mono" style="font-size:16px;">'+n+'</span></div>'; }

function handleEspelhoFile(file){
  var es = state.espelhoSync;
  es.loading = true; es.error=""; render();
  ensureXLSX(function(){
    var reader = new FileReader();
    reader.onload = function(e){
      try{
        var data = new Uint8Array(e.target.result);
        var wb = XLSX.read(data, {type:"array"});
        if(wb.SheetNames.indexOf("4.ESPELHO") === -1){
          es.loading=false; es.error="Não foi encontrada a aba 4.ESPELHO."; render(); return;
        }
        var espSheet = wb.Sheets["4.ESPELHO"];
        var grid = sheetToGrid(espSheet);
        var parsed = parseEspelhoSheet(grid, espSheet);
        var reconcile = espReconcile(parsed.buckets, state.ferramentas);
        var dup = !!(parsed.emitidoEm && state.ferramentas.some(function(t){ return t.origemEspelho && t.origemEspelho===parsed.emitidoEm; }));
        es.loading=false; es.step="preview"; es.parsed=parsed; es.reconcile=reconcile; es.duplicateWarning=dup;
        render();
      }catch(err){
        es.loading=false; es.error="Erro ao ler arquivo: "+(err&&err.message||""); render();
      }
    };
    reader.onerror = function(){ es.loading=false; es.error="Erro ao ler arquivo."; render(); };
    reader.readAsArrayBuffer(file);
  });
}

function doConfirmEspelhoSync(){
  var es = state.espelhoSync;
  if(!es || !es.reconcile || !state.db) return;
  es.busy = true; es.error=""; render();
  var now = new Date().toISOString();
  var emitidoEm = es.parsed.emitidoEm;
  var counts = { novas:0, promovidas:0, alteradas:0, mantidas:0, retiradas:0, erros:0, errosDetalhe:[] };

  function buildNewDoc(row, item){
    return {
      codigo: row.codigo, cliente: row.cliente, quantidadeKg: row.quantidadeKg, corte: row.corte,
      liga: row.liga, barras: row.barras||"", tipo: item.tipo, prensa: item.prensa, turno: item.turno,
      turnoOrigem: (item.tipo==="Reserva" ? "Dia" : (item.oldDoc && item.oldDoc.turnoOrigem==="Dia" ? "Dia" : null)),
      dataProgramacao: item.data, observacaoPCP: row.observacaoPCP||"",
      solicitadoPor: { uid: state.user.uid, nome: state.user.nome },
      criadoEm: now, origemEspelho: emitidoEm
    };
  }

  var ops = es.reconcile.items.map(function(item){
    if(item.type==="NOVA"){
      var doc = buildNewDoc(item.newRow, item);
      return withPermissionRetry(function(){
        return state.db.collection("ferramentas").add(doc).then(function(){ return upsertNecessidadeDelta(doc, 1); });
      }).then(function(){ counts.novas++; }).catch(function(err){ counts.erros++; counts.errosDetalhe.push("Nova "+item.newRow.codigo+": "+(err&&err.message||"")); });
    }
    if(item.type==="PROMOVIDA" || item.type==="ALTERADA"){
      var newDoc = buildNewDoc(item.newRow, item);
      return withPermissionRetry(function(){
        return state.db.doc("ferramentas/"+item.oldDoc.id).delete()
          .then(function(){ return upsertNecessidadeDelta(item.oldDoc, -1); })
          .then(function(){ return state.db.collection("ferramentas").add(newDoc); })
          .then(function(){ return upsertNecessidadeDelta(newDoc, 1); });
      }).then(function(){ if(item.type==="PROMOVIDA") counts.promovidas++; else counts.alteradas++; })
        .catch(function(err){ counts.erros++; counts.errosDetalhe.push(item.type+" "+item.oldDoc.codigo+": "+(err&&err.message||"")); });
    }
    if(item.type==="SEM_ALTERACAO"){ counts.mantidas++; return Promise.resolve(); }
    if(item.type==="RETIRADA"){ counts.retiradas++; return Promise.resolve(); } // nunca excluído automaticamente
    return Promise.resolve();
  });

  Promise.all(ops).then(function(){
    es.busy=false; es.step="done";
    es.done = { novas:counts.novas, promovidas:counts.promovidas, alteradas:counts.alteradas, mantidas:counts.mantidas, retiradas:counts.retiradas, erros:counts.erros, errosDetalhe:counts.errosDetalhe, horario:now };
    render();
  });
}

/* ================= SUBSCRIPTIONS ================= */
function startSubs(){
  if(!state.db) return;
  if(state.user.perfil==="pcp" && !state.unsub){
    state.unsub = state.db.collection("ferramentas").limit(2000).onSnapshot(function(snap){
      state.ferramentas = snap.docs.map(function(d){ var v=d.data(); v.id=d.id; return v; });
      state.dataLoaded = true;
      render();
    }, function(err){
      state.dataLoaded = true;
      state.toast = "Conexão de dados interrompida.";
      render();
    });
  }
  if(state.user.perfil==="correcao" && !state.unsubNecessidades){
    state.unsubNecessidades = state.db.collection("necessidades").limit(2000).onSnapshot(function(snap){
      var map = {};
      snap.docs.forEach(function(d){ map[d.id] = d.data(); });
      state.necessidadesByKey = map;
      state.dataLoaded = true;
      render();
    }, function(err){
      state.dataLoaded = true;
      state.toast = "Conexão de dados interrompida.";
      render();
    });
  }
  if(!state.unsubStatus){
    state.unsubStatus = state.db.collection("status").limit(2000).onSnapshot(function(snap){
      var map = {};
      snap.docs.forEach(function(d){ map[d.id] = d.data(); });
      state.statusByKey = map;
      render();
    }, function(err){ /* status is supplementary; keep going without it */ });
  }
}

/* ================= SETUP SCREEN (shown when Firebase isn't configured) ================= */
function renderSetupNotice(){
  return '<div class="setup-wrap"><div class="box">' +
    '<h2 style="font-size:20px;margin-bottom:10px;">Configuração pendente</h2>' +
    '<p class="hint" style="font-size:13.5px;line-height:1.5;">Este app ainda não está conectado a um banco de dados. Abra o arquivo <b>index.html</b>, procure por <b>FIREBASE_CONFIG</b> perto do topo, e cole ali a configuração do seu projeto Firebase (Console do Firebase → Configurações do projeto → Seus apps → SDK).</p>' +
  '</div></div>';
}

/* ================= INIT ================= */
render();
(window.__FIREBASE_DB_PROMISE || Promise.resolve(null)).then(function(result){
  if(!result){
    state.dbReady = true; state.user = null; render();
    app.innerHTML += renderSetupNotice();
    return;
  }
  state.db = result.db;
  window.__AUTH_API = result.authApi;
  state.dbReady = true;
  if(result.initialUid){
    state.db.doc("users/"+result.initialUid).get().then(function(snap){
      if(snap.exists){
        var data = snap.data();
        state.user = { uid: result.initialUid, nome: data.nome, perfil: data.role };
        render(); startSubs();
      } else {
        state.user = null; render();
      }
    }).catch(function(){ state.user = null; render(); });
  } else {
    state.user = null; render();
  }
}).catch(function(){
  state.dbReady = true; render();
});

})();
</script>
