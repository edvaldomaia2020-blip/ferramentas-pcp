async function load(){const gen=++generation;el('message').textContent='CARREGANDO PUBLICAÇÃO…';el('panel').style.visibility='hidden';try{

function ligarPrevia(html,snap){try{
 const ind=snap?.materiais?.indicador,lista=snap?._gestao?.previa?.pedidosDia?.[ind?.data];
 if(!ind||!Array.isArray(lista)||!lista.length||!/<script[^>]*id="pcp-base"[^>]*>[\s\S]*?<\/script>/.test(html))return html;
 const v=structuredClone(snap),vi=v.materiais.indicador,antes=new Map((vi.pedidos||[]).map(x=>[String(x.pedido),x]));
 const kgA=(vi.pedidos||[]).reduce((s,x)=>s+Number(x.kg||0),0),valA=(vi.pedidos||[]).reduce((s,x)=>s+Number(x.valor_est||0),0),media=kgA>0?valA/kgA:0;
 // fila sem pedido: usa os pedidos do mesmo cliente que o robô já listou para o dia (o resto fica sem pedido)
 const nome=c=>String(c||'').trim().toUpperCase(),usados=new Set(lista.filter(x=>x.pedido).map(x=>String(x.pedido))),itens=[];
 for(const x of lista){if(x.pedido){itens.push(x);continue}let resto=Number(x.kg);for(const o of vi.pedidos||[])if(resto>0.5&&nome(o.cliente)===nome(x.cliente)&&!usados.has(String(o.pedido))){const kg=Math.min(resto,Number(o.kg||0));if(kg>0){itens.push({...x,pedido:String(o.pedido),kg});usados.add(String(o.pedido));resto-=kg}}if(resto>0.5)itens.push({...x,kg:Math.round(resto*10)/10})}
 vi.pedidos=itens.map(x=>{const o=x.pedido?antes.get(String(x.pedido)):null,preco=Number(o?.preco_kg)||media;return {pedido:x.pedido||'',cliente:o?.cliente||x.cliente,kg:Number(x.kg),situacao:'PREVISTO',motivo:'PRÉVIA · '+(x.origem||''),decisao:'',origem:'PRÉVIA DE FATURAMENTO',preco_origem:o?o.preco_origem:'média geral',preco_kg:preco,valor_est:Math.round(Number(x.kg)*preco*100)/100}});
 vi.previsto_pedidos_kg=vi.pedidos.reduce((s,x)=>s+x.kg,0);vi.previsto_total_kg=vi.previsto_pedidos_kg;vi.sem_vinculo_kg=0;vi.origem_previsao='PRÉVIA DE FATURAMENTO';

}catch(e){console.warn('prévia não ligada ao quadro',e);return html}}
window.centralCloud={context:null,async history(){const rows=await getDocs(query(collection(db,'central_publicacoes'),orderBy('publicadoEm','desc'),limit(20)));return rows.docs.map(x=>x.data());},async save(body){
 if(saving)throw Error('Uma gravação já está em andamento.');
 if(auth.currentUser?.uid!==OWNER)throw Error('Somente Edvaldo pode salvar e publicar.');
 if(!cloudSnapshot||!cloudMeta||!cloudHtml)throw Error('Carregue a publicação primeiro.');
 saving=true;const expectedId=cloudMeta.publicacao;
 try{
  let next;
  if(body.action==='restaurar'){
   if(!/^[a-f0-9]{32}$/.test(body.publicacao))throw Error('Publicação inválida.');
   const old=await getDoc(doc(db,'central_publicacoes',body.publicacao));if(!old.exists())throw Error('Versão não encontrada.');const oldMeta=old.data();
   if(!Number.isInteger(oldMeta.partes)||oldMeta.partes<1||oldMeta.partes>30)throw Error('Versão inválida.');
   const parts=await Promise.all(Array.from({length:oldMeta.partes},(_,i)=>getDoc(doc(db,'central_publicacoes',body.publicacao,'partes',String(i)))));if(parts.some(p=>!p.exists()))throw Error('Versão incompleta.');
   const zip=Uint8Array.from(atob(parts.map(p=>p.data().conteudo).join('')),c=>c.charCodeAt(0)),oldRaw=await new Response(new Blob([zip]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
   const digest=[...new Uint8Array(await crypto.subtle.digest('SHA-256',oldRaw))].map(x=>x.toString(16).padStart(2,'0')).join('');if(digest!==oldMeta.sha256)throw Error('Falha na integridade da versão.');
   next=JSON.parse(new DOMParser().parseFromString(new TextDecoder().decode(oldRaw),'text/html').getElementById('pcp-base').textContent);
   next._cloud_history=[{at:new Date().toISOString(),action:'RESTAURAÇÃO',reason:'Restaurada publicação '+body.publicacao},...(cloudSnapshot._cloud_history||[])].slice(0,200);
  }else next=window.centralViews.action(cloudSnapshot,body);
  const ind=next.materiais?.indicador;if(body.action==='faturamento'&&ind?.data===body.dia){ind.pedidos=window.centralViews.billing(next,body.dia).pedidos;ind.previsto_pedidos_kg=ind.pedidos.reduce((s,x)=>s+Number(x.kg),0);ind.previsto_total_kg=ind.previsto_pedidos_kg;ind.sem_vinculo_kg=0;ind.edicao_no_banco=true;}
  const payload=JSON.stringify(next).replaceAll('</','<\\/');
  if(!/<script[^>]*id="pcp-base"[^>]*>[\s\S]*?<\/script>/.test(cloudHtml))throw Error('Base da publicação não encontrada.');
  const html=cloudHtml.replace(/(<script[^>]*id="pcp-base"[^>]*>)[\s\S]*?(<\/script>)/,(_,a,b)=>a+payload+b);
  const raw=new TextEncoder().encode(html),zipped=new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer());
  let binary='';for(let i=0;i<zipped.length;i+=32768)binary+=String.fromCharCode(...zipped.subarray(i,i+32768));const packed=btoa(binary),chunks=[];for(let i=0;i<packed.length;i+=180000)chunks.push(packed.slice(i,i+180000));

  const id=crypto.randomUUID().replaceAll('-',''),meta={publicacao:id,sha256:hash,partes:chunks.length,revision:cloudMeta.revision+1,publicadoEm:new Date().toISOString(),formato:'html-gzip-base64-v1'};
  await runTransaction(db,async tx=>{const actual=await tx.get(doc(db,'central_pcp','atual'));if(!actual.exists()||actual.data().publicacao!==expectedId)throw Error('CONFLITO: outra tela publicou. Atualize antes de salvar.');if(auth.currentUser?.uid!==OWNER)throw Error('Sessão encerrada.');for(let i=0;i<chunks.length;i++)tx.set(doc(db,'central_publicacoes',id,'partes',String(i)),{conteudo:chunks[i]});tx.set(doc(db,'central_publicacoes',id),meta);tx.set(doc(db,'central_pcp','atual'),meta);});

}};

let robotTimer=null,feedbackTimer=null;
const robotWatches={conciliacao:{pending:false,errors:0},fechamento:{pending:false,errors:0}};
async function robotCall(path,method='GET'){
 if(auth.currentUser?.uid!==OWNER)throw Error('Somente seu acesso pessoal pode iniciar robôs.');
 const token=await auth.currentUser.getIdToken();
 const r=await fetch('http://127.0.0.1:8767'+path,{method,headers:{Authorization:'Bearer '+token,...(method==='POST'?{'Content-Type':'application/json'}:{})},...(method==='POST'?{body:'{}'}:{}),signal:AbortSignal.timeout(15000)});
 const d=await r.json();if(!r.ok)throw Error(d.error||'Falha no atualizador.');return d;
}
function watchStarted(key,kind){Object.assign(robotWatches[key],{pending:true,errors:0,connectionWarned:false,kind});try{sessionStorage.setItem('pcp-robot-pending-'+key,kind||'coleta')}catch(e){}scheduleRobotFeedback(500);}
function scheduleRobotFeedback(delay=4000){clearTimeout(feedbackTimer);if(auth.currentUser?.uid===OWNER)feedbackTimer=setTimeout(pollRobotFeedback,delay);}
function finishWatch(key,s){const w=robotWatches[key];w.pending=false;w.errors=0;try{sessionStorage.removeItem('pcp-robot-pending-'+key)}catch(e){}
 let name,outcome,message;
 if(key==='conciliacao'){name=s.modo==='faturamento'?'Faturamento Aureon — coleta e publicação':'Conciliação — coleta das bases';const stage=String(s.etapa||'');outcome=stage.includes('FALHA')?'fail':stage==='PUBLICADO E CONFERIDO'?'ok':'warn';message=stage==='PUBLICADO E CONFERIDO'?'Bases coletadas e painel publicado. Versão '+s.online_revision+'.':stage.includes('REVIS')?'A coleta terminou, mas há '+Number(s.conflicts||0)+' pendência(s) para revisar. A publicação anterior foi preservada.':(s.erro||stage||'Confira o resultado no andamento dos robôs.');}
 else{const op=s.operacao||{},collect=(op.tipo||w.kind)==='coleta';name=collect?'Fechamento Acesys — coleta das bases':'Fechamento Acesys — execução';outcome=op.exit_code===0?(collect&&s.erro?'warn':'ok'):'fail';message=op.exit_code!==0?'O robô encerrou com falha (código '+op.exit_code+'). Confira o controle antes de repetir.':collect?(s.erro||'Bases coletadas. Lista atualizada: '+(s.todos||[]).length+' item(ns). Confira e salve suas autorizações.'):'Execução encerrada. Consulte o histórico e faça uma nova coleta para confirmar quais itens saíram da carteira.';}
 // 24/11/2026 (PCP): status de atualização dos 4 painéis, gravado pelo robô em automacao.json (status_paineis.py)
 if(key==='conciliacao'&&Array.isArray(s.paineis)&&s.paineis.length)message+='\nSTATUS DOS PAINÉIS:\n'+s.paineis.map(p=>(p.status==='ATUALIZADO'?'✓ ':'✗ ')+p.painel+': '+p.status+(p.detalhe?' — '+p.detalhe:'')).join('\n');

  const progress=window.centralCloud.closingProgress(s);

async function pollRobotFeedback(){
 if(auth.currentUser?.uid!==OWNER)return;
 await Promise.all(Object.entries(robotWatches).map(async([key,w])=>{
  try{let s;if(key==='conciliacao')s=await robotCall('/status');else s=await window.centralCloud.closing('/state');const running=key==='conciliacao'?s.running:s.operacao?.running;
   w.errors=0;
   if(running){if(!w.pending)watchStarted(key,s.operacao?.tipo||'coleta');}
   else if(w.pending){if(key==='fechamento'&&s.operacao?.exit_code==null){if(!w.connectionWarned){w.connectionWarned=true;window.robotFeedback.completed('Fechamento Acesys','connection','O controle foi reiniciado ou não tem o resultado desta operação. Confira o histórico antes de repetir.');}return;}finishWatch(key,s);}
  }catch(e){if(w.pending&&++w.errors>=3&&!w.connectionWarned){w.connectionWarned=true;window.robotFeedback.completed(key==='conciliacao'?'Conciliação':'Fechamento Acesys','connection','Não foi possível consultar o robô. Isso não confirma que ele terminou. O acompanhamento continuará tentando reconectar.');}}

 const p=s.progresso,steps=p?.passos||[],done=steps.filter(x=>x.estado==='concluido').length;
 const age=s.ultima_atividade?Math.max(0,Math.floor((Date.now()-new Date(s.ultima_atividade))/1000)):null;
 const duration=t=>{const n=Math.max(0,Math.floor((Date.now()-new Date(t))/1000));return Math.floor(n/60)+'min '+n%60+'s';};
 summary.textContent=steps.length?done+' de '+steps.length+' etapas concluídas'+(p.reconstruido?' · resultados recuperados do registro desta rodada':''):'';
 if(s.running&&age!==null)summary.textContent+=' · Último registro há '+age+'s'+(age>=60?' — processo ativo, aguardando novo registro. Isso não confirma travamento.':'');
 if(!s.running&&s.etapa!=='PUBLICADO E CONFERIDO')summary.textContent+=' · A atualização não está em execução. Confira o resultado acima.';
 if(s.avisos?.length)summary.textContent+='\nATENÇÃO: '+s.avisos.join(' | ');if(s.paineis_texto)summary.textContent+='\nSTATUS DOS PAINÉIS:\n'+s.paineis_texto;
 const names={pendente:'Aguardando',executando:'Em execução',concluido:'Concluído',falha:'FALHA'};
 steps.forEach((step,i)=>{const row=document.createElement('div');row.style.cssText='padding:10px 12px;border-left:5px solid '+({concluido:'#218349',executando:'#167da0',falha:'#bd3028',pendente:'#b8c2cc'}[step.estado]||'#b8c2cc')+';background:#f1f5f8;border-radius:4px';const title=document.createElement('strong');title.textContent=(i+1)+'. '+step.nome+' — '+(names[step.estado]||step.estado);row.append(title);const detail=document.createElement('div');detail.style.cssText='font-size:14px;margin-top:4px';detail.textContent=(step.detalhe||'')+(step.estado==='executando'&&step.inicio?' · há '+duration(step.inicio):'');row.append(detail);holder.append(row);});
 el('robot-progress-log').textContent=s.detalhes||'Nenhum registro detalhado disponível para esta rodada.';
}
async function robotProgress(){
 const box=el('robot-status');box.hidden=false;box.textContent='Consultando atualizador…';setRobotProgressDetail(box.textContent);
 try{const s=await robotCall('/status');renderRobotSteps(s);box.textContent='ROBÔS · '+s.etapa+(s.at?' · '+new Date(s.at).toLocaleString('pt-BR'):'')+(s.erro?'\n'+s.erro:'')+(s.online_revision?'\nVersão online '+s.online_revision:'');setRobotProgressDetail(box.textContent+(s.running?'\n\nEM EXECUÇÃO — aguarde a conclusão.':'\n\nSEM COLETA EM EXECUÇÃO.'));el('run-robots').disabled=s.running;el('run-billing').disabled=s.running;
 if(s.running){clearTimeout(robotTimer);robotTimer=setTimeout(robotProgress,3000);}else{clearTimeout(robotTimer);if(s.etapa==='PUBLICADO E CONFERIDO')await load();}
 }catch(e){clearTimeout(robotTimer);el('run-robots').disabled=false;el('run-billing').disabled=false;box.textContent='ATUALIZADOR NÃO CONECTADO. No computador PCP, abra INICIAR_ATUALIZADOR.bat na pasta atualizada. Depois clique ANDAMENTO DOS ROBÔS. Detalhe: '+e.message;setRobotProgressDetail(box.textContent);}
}
let startingRobots=false;
async function confirmRobotPassword(title='Iniciar atualização',description='Confirme sua senha de entrada para iniciar os robôs. Deixe o computador livre durante a coleta.'){
 const user=auth.currentUser;if(user?.uid!==OWNER||!user.email)throw Error('Entre com seu acesso pessoal.');
 const dialog=document.createElement('dialog');dialog.style.cssText='max-width:420px;width:90%;border:0;border-radius:10px;padding:24px;color:#19344f';
 dialog.innerHTML='<form method="dialog"><h2>Iniciar atualização</h2><p>Confirme sua senha de entrada para iniciar os robôs. Deixe o computador livre durante a coleta.</p><label>Senha de entrada<input type="password" autocomplete="current-password" required autofocus></label><p role="alert" style="color:#a12622"></p><div style="display:flex;gap:12px;justify-content:flex-end"><button type="button" data-cancel>Cancelar</button><button type="submit">Confirmar e iniciar</button></div></form>';
 dialog.querySelector('h2').textContent=title;dialog.querySelector('p').textContent=description;
 document.body.append(dialog);
 return new Promise((resolve,reject)=>{
  let settled=false,checking=false;
  const finish=(ok)=>{if(settled)return;settled=true;dialog.querySelector('input').value='';dialog.close();dialog.remove();resolve(ok);};
  dialog.querySelector('[data-cancel]').onclick=()=>finish(false);
  dialog.addEventListener('cancel',e=>{e.preventDefault();finish(false)});
  dialog.querySelector('form').onsubmit=async e=>{
   e.preventDefault();if(checking)return;checking=true;const submit=dialog.querySelector('button[type="submit"]');submit.disabled=true;
   const field=dialog.querySelector('input');const password=field.value;field.value='';
   try{await reauthenticateWithCredential(user,EmailAuthProvider.credential(user.email,password));
    if(settled||auth.currentUser?.uid!==user.uid)return;
    await user.getIdToken(true);finish(true);
   }catch(error){if(!settled){dialog.querySelector('[role="alert"]').textContent='Senha não confirmada. Confira sua senha e tente novamente.';field.focus();}}
   finally{checking=false;if(!settled)submit.disabled=false;}
  };
  dialog.showModal();
 });
}

};

window.centralCloud.closingProgress=s=>{
 let round=null;try{round=JSON.parse(sessionStorage.getItem('pcp-closing-round')||'null')}catch(e){}
 const history=s.execucoes?.historico||[];
 if(!round?.itens?.length)return {tracked:false,sucesso:Number(s.execucoes?.ultima_rodada?.itens||0),historico_total:new Set(history.flatMap(r=>(r.itens||[]).map(i=>String(r.pedido)+'/'+String(i)))).size};
 const targets=new Set(round.itens),success=new Set(),confirmed=new Set(),review=new Set();
 for(const r of history)for(const i of r.itens||[]){const key=String(r.pedido)+'/'+String(i);if(!targets.has(key))continue;success.add(key);if(String(r.status).startsWith('CONFIRMADO'))confirmed.add(key);if(String(r.status).startsWith('REVISAR'))review.add(key);}
 const uncertain=new Set((s.execucoes?.envios_pendentes||[]).filter(k=>targets.has(k)&&!success.has(k)));
 for(const row of s.todos||[]){if(!targets.has(row.chave))continue;if(row.estado==='JÁ APLICADO')success.add(row.chave);else if(String(row.estado).includes('EXECUÇÃO ANTERIOR'))uncertain.add(row.chave);}
 const total=targets.size,pending=Math.max(0,total-success.size-uncertain.size),running=s.operacao?.tipo==='execucao'&&s.operacao.running;
 return {tracked:true,total,sucesso:success.size,confirmados:confirmed.size,revisar:review.size,conferir:uncertain.size,restantes:pending,running,percent:total?Math.round(100*success.size/total):0};
};
window.centralCloud.closing=async(path,body)=>{
 if(auth.currentUser?.uid!==OWNER)throw Error('Somente seu acesso pessoal pode usar o controle de fechamento.');
 if(['/collect','/execute'].includes(path)){
  const executing=path==='/execute';
  if(!await confirmRobotPassword(executing?'Executar fechamentos autorizados':'Coletar bases do fechamento',executing?'Esta ação fecha no Acesys somente os itens com SIM válido exibidos no controle. Confirme sua senha para executar.':'Esta ação coleta as fontes de fechamento. Não fecha pedidos. Confirme sua senha para coletar.'))throw Error('Cancelado. Nenhuma execução iniciada.');
 }
 const token=await auth.currentUser.getIdToken();
 const response=await fetch('http://127.0.0.1:8770'+path,{method:body===undefined?'GET':'POST',headers:{Authorization:'Bearer '+token,...(body===undefined?{}:{'Content-Type':'application/json'})},...(body===undefined?{}:{body:JSON.stringify(body)}),signal:AbortSignal.timeout(20000)});
 const result=await response.json();if(!response.ok)throw Error(result.error||'Falha no controle de fechamento.');if(path==='/execute'){try{sessionStorage.setItem('pcp-closing-round',JSON.stringify({itens:body.itens,at:new Date().toISOString()}))}catch(e){}}if(path==='/collect'||path==='/execute')watchStarted('fechamento',path==='/collect'?'coleta':'execucao');return result;
};

async function checkRobotConnections(){
 const checks=await Promise.all([['Conciliação',8767,'pcp-atualizacao'],['Fechamento',8770,'pcp-fechamento']].map(async([name,port,service])=>{try{const r=await fetch('http://127.0.0.1:'+port+'/health',{signal:AbortSignal.timeout(1500)});const d=await r.json();return {name,ready:r.ok&&d.service===service}}catch(e){return {name,ready:false}}}));return checks;
}

 const button=el('connect-robots'),box=el('robot-status');button.disabled=true;box.hidden=false;box.textContent='01 — Conferindo conexão dos robôs…';

  let checks=await checkRobotConnections();
  if(!checks.every(x=>x.ready)){
   const link=document.createElement('a');link.href='extrutech-pcp://conectar/';document.body.append(link);link.click();link.remove();

  box.textContent=checks.every(x=>x.ready)?'01 — ROBÔS CONECTADOS. Conciliação e fechamento disponíveis. Escolha a operação e confirme sua senha para executar.':'01 — Ainda não conectado: '+checks.filter(x=>!x.ready).map(x=>x.name).join(', ')+'. Na primeira utilização, execute INSTALAR_BOTAO_01.bat da pasta pcp_protegido uma única vez. Depois clique novamente em 01 — CONECTAR ROBÔS.';

el('publication-file').onchange=async()=>{const file=el('publication-file').files[0];if(!file)return;el('publish').disabled=true;try{
 if(auth.currentUser?.uid!==OWNER)throw Error('Somente Edvaldo pode publicar.');
 if(file.size>6000000)throw Error('Arquivo muito grande.');
 const data=JSON.parse(await file.text()),m=data.metadata;
 if(m?.formato!=='html-gzip-base64-v1'||!Number.isInteger(m.revision)||!Array.isArray(data.chunks)||data.chunks.length<1||data.chunks.length>30||data.chunks.some(x=>typeof x!=='string'||x.length>180000))throw Error('Arquivo de publicação inválido.');
 const zipped=Uint8Array.from(atob(data.chunks.join('')),c=>c.charCodeAt(0));
 const raw=await new Response(new Blob([zipped]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
 const hash=[...new Uint8Array(await crypto.subtle.digest('SHA-256',raw))].map(x=>x.toString(16).padStart(2,'0')).join('');
 if(hash!==m.sha256)throw Error('Arquivo não passou na conferência.');
 const ref=doc(db,'central_pcp','atual'),before=await getDoc(ref),beforeId=before.exists()?before.data().publicacao:null;
 if(before.exists()&&before.data().revision>m.revision)throw Error('Arquivo local anterior à versão online. Sincronize os ajustes online antes de publicar.');
 const incoming=JSON.parse(new DOMParser().parseFromString(new TextDecoder().decode(raw),'text/html').getElementById('pcp-base').textContent);
 if(beforeId!==cloudMeta?.publicacao)throw Error('Outra posição foi publicada. Atualize a consulta antes de importar.');
 if(cloudSnapshot?._cloud_history?.length&&incoming._cloud_sync?.publicacao!==beforeId)throw Error('Existem ajustes online. Baixe a posição online e sincronize no PCP antes de publicar uma nova coleta.');

 const id=crypto.randomUUID().replaceAll('-',''),meta={publicacao:id,sha256:hash,partes:data.chunks.length,revision:m.revision,publicadoEm:new Date().toISOString(),formato:m.formato};
 el('message').textContent='PUBLICANDO POSIÇÃO SALVA… Esta operação não coleta bases novas.';
 await runTransaction(db,async tx=>{const actual=await tx.get(ref);if((actual.exists()?actual.data().publicacao:null)!==beforeId)throw Error('Outra publicação ocorreu. Confira antes de repetir.');for(let i=0;i<data.chunks.length;i++)tx.set(doc(db,'central_publicacoes',id,'partes',String(i)),{conteudo:data.chunks[i]});tx.set(doc(db,'central_publicacoes',id),meta);tx.set(ref,meta);});
 await load();
 }catch(e){el('message').textContent='NÃO PUBLICADO: '+(e.code==='permission-denied'?'Acesso de escrita negado.':e.message);}finally{el('publish').disabled=false;el('publication-file').value='';}};
</script></html>
